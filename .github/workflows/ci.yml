name: CI

# Phase 0A CI skeleton (backlog S0-4, PLAN §15).
#
# Deliberately excludes coverage, ArchUnit, and the AI eval harness — those gates depend on
# foundations that do not exist yet and are owned by tasks/15-quality-gates.md.
# Later tasks must EXTEND these jobs rather than add parallel ones.
#
# The OpenAPI drift gate landed with tasks/06-openapi-error-platform.md: spec validation runs
# inside the `backend` job, and the codegen drift check inside the `frontend` job.
#
# No job requires a provider secret. CI must stay runnable on a fork.

on:
  pull_request:
    branches: [master, main, dev]
  push:
    branches: [master, dev]
  workflow_dispatch:

# A new push to the same ref cancels the superseded run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '21'

jobs:
  # ---------------------------------------------------------------------------
  # Runtime gate. Runs on both OSes because the prerequisite scripts are
  # platform-specific and were only ever executed on Windows (baseline F-7).
  # ---------------------------------------------------------------------------
  prerequisites:
    name: prereq (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # Assert the runtimes independently of the project's own gate, so a broken gate
      # cannot mask a wrong runtime by passing itself.
      - name: Assert Node 22 and Java 21
        shell: bash
        run: |
          node_major="$(node -p 'process.versions.node.split(".")[0]')"
          [ "$node_major" = "22" ] || { echo "expected Node 22, got $(node -v)"; exit 1; }
          java -version 2>&1 | head -1
          java -version 2>&1 | grep -Eq '"(21)[.".]' || { echo "expected Java 21"; exit 1; }
          echo "runtimes OK: $(node -v), Java 21"

      # Unit tests for the gate itself — no Docker needed, so both OSes can run them.
      - name: Prerequisite script tests
        run: npm run prereq:test

      # The full gate needs Docker, which only the Linux runner provides.
      - name: Prerequisite gate
        if: runner.os == 'Linux'
        run: npm run prereq

  # ---------------------------------------------------------------------------
  backend:
    name: backend (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          # Caches ~/.gradle dependencies only — never build output or credentials.
          cache: gradle

      # Also validates api/openapi/openapi.yaml and asserts the error catalog matches
      # ApiErrorCode (task 06) — OpenApiSpecTest and ErrorCatalogTest run inside `build`.
      - name: Build and test
        run: ./gradlew --no-daemon build

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            apps/backend/build/reports/tests/
            apps/backend/build/test-results/
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  frontend:
    name: frontend (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      # `npm ci` not `npm install`: the lockfile is the contract, and a drifted
      # lockfile should fail rather than be silently rewritten.
      - name: Install
        run: npm ci

      # Contract gate (task 06). The OpenAPI spec in apps/backend is the single source of truth;
      # this proves the committed client was generated from the spec as it stands right now.
      # Regenerating and diffing beats checking a hash: the failure output is the drift itself.
      - name: Contract codegen drift
        run: |
          set -euo pipefail
          npm run codegen
          # `git status --porcelain`, not `git diff`: diff ignores UNTRACKED files, so a codegen
          # run that emits a brand-new module would pass a diff-based gate while the client sat
          # uncommitted. Porcelain catches modified, untracked, and deleted alike.
          drift="$(git status --porcelain -- src/generated/)"
          if [ -n "$drift" ]; then
            echo "::error::src/generated is stale — run 'npm run codegen' from the repo root"
            echo "::error::and commit the regenerated client."
            echo "$drift"
            git diff -- src/generated/ || true
            exit 1
          fi
          echo "generated client matches the contract"

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Builds the SAME Dockerfiles developers use locally, through the same compose
  # file, then smoke-tests the running stack. Parity is the point: an image that
  # only CI can build is worthless.
  # ---------------------------------------------------------------------------
  docker:
    name: docker build + smoke
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      # .env.example doubles as the CI configuration. If it drifts out of sync with what
      # compose requires, this job fails — which is the cheapest place to find out.
      - name: Seed .env from the committed template
        run: cp .env.example .env

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Wait for readiness
        run: ./scripts/wait-for-services.sh
        env:
          TIMEOUT_SECONDS: '180'

      - name: Smoke test
        run: |
          set -euo pipefail
          echo "--- health ---"
          curl -fsS http://localhost:8080/api/v1/health
          echo; echo "--- ready ---"
          ready="$(curl -fsS http://localhost:8080/api/v1/ready)"
          echo "$ready"
          # Readiness must prove the database, not just the process.
          echo "$ready" | grep -q '"database":"UP"' || { echo "database not UP"; exit 1; }
          echo; echo "--- frontend ---"
          curl -fsS -o /dev/null -w '%{http_code}\n' http://localhost:3000/

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------------
  security:
    name: security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Repository hygiene. Deliberately dependency-free so it cannot be skipped by a
      # third-party action being unavailable or unlicensed.
      - name: No committed secrets or env files
        run: |
          set -euo pipefail
          fail=0

          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked by git — it must stay ignored (PLAN §4.0.0.2)"
            fail=1
          fi

          tracked_secrets="$(git ls-files | grep -E '(^|/)\.env(\..*)?$|\.pem$|\.p12$|\.jks$|(^|/)secrets/' | grep -v '^\.env\.example$' || true)"
          if [ -n "$tracked_secrets" ]; then
            echo "::error::secret-like files are tracked:"; echo "$tracked_secrets"
            fail=1
          fi

          # Obvious provider key shapes anywhere in tracked content.
          hits="$(git grep -nIE '(sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' -- . ':!.github/workflows/ci.yml' || true)"
          if [ -n "$hits" ]; then
            echo "::error::possible committed credential:"; echo "$hits"
            fail=1
          fi

          [ "$fail" -eq 0 ] && echo "no committed secrets found"
          exit "$fail"

      # PR-only: flags dependencies introduced with known vulnerabilities.
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
