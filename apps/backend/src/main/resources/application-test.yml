# Automated tests. Must stay dependency-free so `./gradlew test` runs without Docker or a
# database.
#
# spring-boot-starter-jdbc is on the classpath from task 04, and its auto-configuration fails
# at startup when no datasource URL is present. Excluding it here keeps the unit and slice
# suites hermetic; DatabaseReadinessContributor is conditional on spring.datasource.url and so
# is simply absent.
#
# Integration tests that need a real PostgreSQL live in a separate Gradle source set
# (`src/test/integration`, task `integrationTest`), run under the `integration-test` profile, and
# declare their own Testcontainers datasource. They are never part of `test`.

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

  # Both back off on their own without a DataSource bean, but "backs off by accident" is not a
  # property to rely on: a future starter that contributes a DataSource would quietly start
  # migrating and validating inside the unit suite. Disabling them explicitly keeps `./gradlew
  # test` hermetic by declaration rather than by luck.
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none

logging:
  level:
    root: WARN
    com.travelplanner: INFO
