<!--
  Sent instead of a reset link when the account has no local password (ADR 009 §4,
  `password_hash IS NULL`), and by registration when the address already belongs to such an account.

  The rule this mail exists to keep: forgot-password must NOT mint a local password for a
  provider-only account. Doing so would convert "I know this person's email address" into a second,
  weaker way into an account whose owner deliberately has only one.
-->
<div style="font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;color:#1f2933;max-width:560px;margin:0 auto;padding:24px">
  <h1 style="font-size:22px;margin:0 0 16px">Sign in with {{providers}}</h1>

  <p style="margin:0 0 16px">
    This Travel Planner account does not have a password. It signs in with
    <strong>{{providers}}</strong>, so there is nothing to reset.
  </p>

  <p style="margin:0 0 20px">
    <a href="{{sign_in_url}}" style="display:inline-block;background:#0f766e;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:6px">Go to sign in</a>
  </p>

  <p style="margin:0;font-size:13px;color:#616e7c">
    If you did not ask for this, no action is needed — nothing about your account has changed, and
    no password was created for it.
  </p>
</div>
