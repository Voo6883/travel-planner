# Base configuration shared by every profile.
# Secrets belong in the single root .env (PLAN §4.0.0.2) and reach the app as environment
# variables — never hard-coded here.

spring:
  application:
    name: travel-planner-backend
  profiles:
    default: local
  jackson:
    # The wire format is snake_case (PLAN §6.1: `page_size`, `expected_version`,
    # `current_version`, `trip_id`). Setting it globally means a Java field named
    # `expectedVersion` cannot silently ship as `expectedVersion` because someone forgot a
    # @JsonProperty — the contract holds by default rather than by vigilance.
    property-naming-strategy: SNAKE_CASE

  jpa:
    # Hibernate never writes DDL. Flyway owns every schema change (PLAN §4.0.2-H), and `validate`
    # turns a migration that drifted from an entity into a startup failure instead of a column
    # that silently reads back null in production.
    hibernate:
      ddl-auto: validate
    # No open session in view. Left on (the Spring Boot default), a lazy association would load
    # from inside the view layer, outside any transaction the service declared — which is both a
    # hidden N+1 and a way for a JPA entity to reach the wire.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          # Every Instant is bound and read as UTC regardless of the JVM's default zone, so a
          # container in Asia/Kuala_Lumpur and one in UTC agree on what a timestamptz means.
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    # A checksum change on an applied migration is an error, not something to repair silently:
    # the database in front of you no longer matches the file that claims to describe it.
    validate-on-migrate: true
    # `flyway clean` drops every object in the schema. There is no environment where an
    # application process should be able to do that to itself.
    clean-disabled: true

# Authentication boundary (ADR 002, ADR 006, ADR 009). Defaults live in AuthSecurityProperties and
# already match what the ADRs lock; only the values that must come from the environment, or that
# differ per profile, are restated here.
travelplanner:
  security:
    jwt:
      # No default and no committed fallback. When this is unset the application generates a key
      # for the process and logs a warning; under the `prod` profile it refuses to start.
      secret: ${JWT_SECRET:}
    session:
      # `Secure` is switched on in application-prod.yml. It cannot be the default: a Secure cookie
      # is dropped over plain HTTP, and the locked local experience is http://localhost (ADR 006).
      secure: false

  # External identity providers (§4.0.5, ADR 004). Every credential defaults to empty and the
  # development stand-ins take over, so a fresh checkout and CI both work with no Firebase project
  # and no GitHub OAuth app — task 10 forbids relying on a live provider in CI. Both stand-ins
  # refuse to be constructed under the `prod` profile.
  identity:
    # Where an OAuth round trip returns the browser: the FRONTEND origin, not the API's.
    app-base-url: ${FRONTEND_URL:http://localhost:3000}
    firebase:
      # Also the `aud` every Firebase ID token must carry (ADR 009 §4). Without it a token minted
      # by any other Firebase project on Earth would carry a valid Google signature.
      project-id: ${FIREBASE_PROJECT_ID:}
    github:
      client-id: ${GITHUB_CLIENT_ID:}
      # No default and no committed fallback. HttpGithubApi cannot be constructed without it.
      client-secret: ${GITHUB_CLIENT_SECRET:}
      callback-url: ${GITHUB_CALLBACK_URL:http://localhost:8080/api/v1/auth/oauth/github/callback}

  # Transactional mail (§4.0.10, ADR 004). The stub is the default everywhere, so a fresh checkout
  # and CI both work with no provider secret — task 09 forbids making live credentials mandatory.
  # Set MAILER_PROVIDER=resend, with RESEND_API_KEY and MAIL_FROM, to send for real.
  mail:
    provider: ${MAILER_PROVIDER:stub}
    from: ${MAIL_FROM:Travel Planner <noreply@travelplanner.local>}
    # The FRONTEND origin, not the API's: a mailed link opens a page, which then calls the confirm
    # endpoint. Mailing an API URL would show a person who clicked a link a bare 204.
    app-base-url: ${FRONTEND_URL:http://localhost:3000}
    resend:
      # No default and no committed fallback. ResendMailerAdapter refuses to start without it, and
      # it cannot be constructed at all unless the provider above says `resend`.
      api-key: ${RESEND_API_KEY:}

server:
  port: 8080
  error:
    # Never leak internals through the default error body; GlobalExceptionHandler owns the
    # response shape (PLAN §6.1).
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

logging:
  # Surfaces the X-Request-Id that RequestIdFilter puts in the MDC (PLAN §4.0.2-J2), so a
  # user-reported failure can be traced to its log lines.
  pattern:
    level: '%5p [%X{requestId:-no-request-id}]'
  level:
    root: INFO
    com.travelplanner: INFO
