# Local host development — apps on the host, Postgres in Docker (PLAN §4.0.0 "Hybrid" mode).
#
# Host-run means `localhost`, not the Compose service name `postgres` (§4.0.0.2). The default
# below reflects that; SPRING_DATASOURCE_URL in the root .env overrides it.

# Flyway is inherited from application.yml: migrations run on startup, so a freshly created
# database is usable with no separate step. `./gradlew flywayValidate` checks the same database
# through SPRING_DATASOURCE_URL.

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/travel_planner}
    username: ${POSTGRES_USER:travel_planner}
    password: ${POSTGRES_PASSWORD:travel_planner}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 3000
      # Start even when Postgres is down, so /api/v1/ready can report it as DOWN. Failing at
      # startup instead would make a stopped database indistinguishable from a broken build.
      initialization-fail-timeout: -1
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

logging:
  level:
    com.travelplanner: DEBUG
    # Explicit rather than inherited: the stub mailer's body log is what carries the verification
    # link, and login is gated on email_verified. Stating it here means narrowing
    # `com.travelplanner` later cannot silently make local sign-up uncompletable again.
    com.travelplanner.infrastructure.mail: DEBUG
