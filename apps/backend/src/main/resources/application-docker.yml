# Full-stack Docker Compose runtime (PLAN §4.0.0).
#
# Compose injects these from the single root .env. The database hostname is the Compose service
# name `postgres` — never `localhost`, which inside a container refers to the container itself
# (§4.0.0.2).

# Flyway is inherited from application.yml and runs on container startup. Compose already gates
# the backend behind the Postgres healthcheck, so the migration always meets a live database.

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/travel_planner}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 3000
      # Readiness reports an unavailable database; the container does not crash-loop on it.
      initialization-fail-timeout: -1

logging:
  level:
    com.travelplanner: INFO
    # The stub mailer logs message bodies at DEBUG, and those bodies carry the verification and
    # password-reset links. Login is gated on email_verified (UC-A08), so with the stub provider
    # and this at INFO a developer can register and then has no reachable way to verify — the link
    # exists only in a message nothing ever delivers. DEBUG here is what makes local sign-up
    # completable: `docker compose logs backend` shows the link.
    #
    # Deliberately scoped to this profile and to the mail package. application-prod.yml does not
    # set it, and the live Resend adapter never logs a body regardless.
    com.travelplanner.infrastructure.mail: DEBUG
