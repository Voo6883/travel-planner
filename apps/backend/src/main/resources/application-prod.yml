# Production placeholder.
#
# Deliberately contains no datasource, credentials, or endpoints — tasks/39-release-readiness.md
# owns production configuration. Every value must arrive as an environment variable at runtime;
# no secret is ever committed here or baked into an image (PLAN §4.0.0.2).

spring:
  jpa:
    hibernate:
      # Restated here rather than inherited, because this is the one value whose accidental
      # override destroys production data. `update` would let Hibernate reshape live tables to
      # match whatever the entities happen to say; PLAN §4.0.2-H forbids it outright.
      ddl-auto: validate
  flyway:
    enabled: true
    clean-disabled: true
    # No baselining in production. If the schema history table is missing, this database is not
    # the one the migrations describe, and startup must fail rather than assume V1..Vn already ran.
    baseline-on-migrate: false

travelplanner:
  security:
    session:
      # TLS is guaranteed here, so the session cookies are marked Secure and a browser will refuse
      # to send them over plain HTTP (ADR 002). JWT_SECRET is mandatory under this profile —
      # HmacJwtTokenService fails startup rather than signing with a key nobody chose.
      secure: true

# Actuator in production (PLAN §4.0.9, task 15 "secure production defaults").
#
# Two independent narrowings, because either one alone is insufficient:
#
#  1. Exposure drops to health + prometheus. `metrics` and `info` are removed — `/actuator/metrics`
#     enumerates every meter name, which describes the system's internals to anyone who can reach
#     it, and `info` carries build and version detail that only helps an attacker fingerprint.
#  2. The endpoints move to their own PORT. This is the part that actually protects them: on 9090
#     they are not routable from the public ingress that fronts 8080 at all, so reaching them
#     requires being inside the network rather than merely guessing a path.
#
# `show-details: never` means /actuator/health answers UP or DOWN and nothing else. The component
# breakdown names the database and its failure reason — a useful probe for someone deciding what
# to attack next.
management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        # Kubernetes-style liveness/readiness split. Liveness failing means restart me; readiness
        # failing means stop sending traffic. Conflating them restarts a pod that is merely
        # waiting on a slow dependency.
        enabled: true

logging:
  level:
    root: WARN
    com.travelplanner: INFO
