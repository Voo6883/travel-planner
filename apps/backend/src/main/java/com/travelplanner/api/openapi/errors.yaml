# Error catalog — the registry named in PLAN §4.0.8 ("Registries: Error codes →
# api/openapi/errors.yaml + DomainException subclasses").
#
# THIS FILE IS THE REGISTRATION POINT FOR EVERY `code` THE API CAN RETURN.
#
# Registration procedure (all five steps, in one change):
#   1. Add the value to `ErrorCode.enum` below, in alphabetical order.
#   2. Add a row to the catalog table in the `description` of `ErrorCode`.
#   3. Add the matching constant to
#      apps/backend/src/main/java/com/travelplanner/api/error/ApiErrorCode.java
#      with its HTTP status.
#   4. Add the i18n string under `errors.<code>` in BOTH
#      apps/frontend/src/locales/en/common.json and .../ms/common.json.
#   5. Run `npm run codegen` from the repo root and commit the regenerated client.
#
# OpenApiSpecTest fails the backend build when steps 1 and 3 disagree, and
# common.errors.test.ts fails the frontend build when step 4 is missed. The procedure is
# therefore enforced, not merely documented.
#
# Scope note: only platform-level codes are registered here. Feature codes
# (`trip_not_found`, `booking_declined`, …) are registered by the task that introduces the
# endpoint which can return them — see tasks/06-openapi-error-platform.md "Do not".

openapi: 3.0.3
info:
  title: Travel Planner error catalog
  version: 1.0.0
  description: Component-only document. Referenced by openapi.yaml; it exposes no paths.

paths: {}

components:
  schemas:
    ErrorCode:
      type: string
      description: |
        Registered machine-readable error identifiers (PLAN §6.1). `snake_case`, stable, and
        never localised — the frontend maps each value to `common.errors.<code>`.

        | Code | HTTP | Meaning |
        |---|---|---|
        | `account_disabled` | 403 | Credential accepted, but the account is switched off (ADR 009 §1) |
        | `account_locked` | 423 | Too many failed sign-ins for this identifier and address (ADR 009 §6). `details.retry_after_seconds` carries the wait |
        | `ai_rate_limited` | 429 | The AI provider rejected the request for quota reasons. Retryable with backoff |
        | `ai_response_invalid` | 502 | The model answered, but the answer failed schema validation and a repair attempt did not fix it. A typed "no confident result", never a partially filled object (PLAN §4.1) |
        | `ai_timeout` | 504 | The AI provider did not answer within the configured budget. Not auto-retried — the call already spent its whole budget |
        | `ai_unavailable` | 503 | The AI provider is unreachable, failing, misconfigured, or the circuit breaker is open |
        | `email_not_verified` | 403 | Credential accepted, but the address is unconfirmed (UC-A08) |
        | `firebase_email_not_verified` | 403 | The Google account behind a Firebase ID token has an unconfirmed address (PLAN §4.0.5) |
        | `forbidden` | 403 | Authenticated, but not allowed to act on this resource |
        | `identity_already_linked` | 409 | This provider identity already belongs to another account, or this account already has an identity for the provider (PLAN §4.0.5). One external identity, one user |
        | `internal_error` | 500 | Unhandled server fault. `details` is always empty |
        | `invalid_credentials` | 401 | Sign-in failed. Identical for an unknown account and a wrong password — never an existence oracle |
        | `invalid_firebase_token` | 401 | A Firebase ID token failed verification: bad signature, wrong `aud`, wrong issuer, expired, or `firebase.sign_in_provider` other than `google.com` (ADR 009 §4) |
        | `invalid_oauth_state` | 400 | The OAuth callback presented no `state`, or one that does not match the state cookie issued at start (ADR 004 Security) |
        | `invalid_token` | 400 | A verification or password-reset link is unknown, expired, or already used (task 09). One code for all three, so the endpoint cannot confirm that a token ever existed |
        | `last_sign_in_method` | 409 | Unlinking this provider would leave the account with no way to sign in (ADR 009 §4) |
        | `not_found` | 404 | No resource at this path, or none owned by the caller. Also returned when unlinking a provider the account never linked |
        | `provider_email_unavailable` | 422 | The provider supplied no primary, verified, non-`noreply` address, so no account can be created from it (ADR 009 §4) |
        | `provider_link_required` | 409 | An account already holds this email but auto-linking is not permitted. Sign in to that account and confirm the link (ADR 009 §4 — the pre-hijack rule) |
        | `provider_unavailable` | 503 | The identity provider could not be reached or answered with a fault. Nothing was changed; the caller may retry |
        | `rate_limited` | 429 | Too many requests for this mail action from this address or for this email (ADR 009 §6). `details.retry_after_seconds` carries the wait |
        | `unauthorized` | 401 | No valid session; the caller must sign in |
        | `validation_failed` | 400 | Request failed schema or constraint validation. `details.fields` maps field name → message |
        | `version_conflict` | 409 | Optimistic-lock mismatch (ADR 008). `details.current_version` carries the server's version |
      enum:
        - account_disabled
        - account_locked
        - ai_rate_limited
        - ai_response_invalid
        - ai_timeout
        - ai_unavailable
        - email_not_verified
        - firebase_email_not_verified
        - forbidden
        - identity_already_linked
        - internal_error
        - invalid_credentials
        - invalid_firebase_token
        - invalid_oauth_state
        - invalid_token
        - last_sign_in_method
        - not_found
        - provider_email_unavailable
        - provider_link_required
        - provider_unavailable
        - rate_limited
        - unauthorized
        - validation_failed
        - version_conflict

    ApiErrorResponse:
      type: object
      description: |
        The single error envelope (PLAN §6.1). **Every** non-2xx JSON response uses this shape,
        including the terminal `event: error` frame of an SSE stream (ADR 007).
      required:
        - code
        - message
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: |
            English fallback for logs and development. Never rendered verbatim to a user —
            the frontend resolves `code` to an i18n key instead.
          example: The requested resource does not exist.
        details:
          type: object
          additionalProperties: true
          nullable: true
          description: |
            Optional structured context: field errors, identifiers, the current version.
            Never a stack trace, an internal package name, or PII.
          example:
            current_version: 9
      example:
        code: not_found
        message: The requested resource does not exist.
        details: {}

    ValidationFailedDetails:
      type: object
      description: |
        Shape of `ApiErrorResponse.details` when `code` is `validation_failed`. Documented
        separately because it is the only `details` payload with a fixed structure that
        clients are expected to read field-by-field.
      required:
        - fields
      properties:
        fields:
          type: object
          additionalProperties:
            type: string
          description: Field name → English constraint message.
          example:
            expected_version: must not be null

    AccountLockedDetails:
      type: object
      description: |
        Shape of `ApiErrorResponse.details` when `code` is `account_locked` (ADR 009 §6). The UI
        renders a countdown instead of inviting a sixth attempt that cannot succeed.
      required:
        - retry_after_seconds
      properties:
        retry_after_seconds:
          type: integer
          format: int64
          minimum: 0
          description: Seconds until the oldest counted failure leaves the 15-minute window.
          example: 540

    RateLimitedDetails:
      type: object
      description: |
        Shape of `ApiErrorResponse.details` when `code` is `rate_limited` (ADR 009 §6). Modelled
        separately from `AccountLockedDetails` even though the field is the same: the two are
        different controls with different windows, and merging them would make a change to one
        silently change the other's contract.
      required:
        - retry_after_seconds
      properties:
        retry_after_seconds:
          type: integer
          format: int64
          minimum: 0
          description: Seconds until the oldest counted request leaves the rate-limit window.
          example: 3600

    ProviderLinkRequiredDetails:
      type: object
      description: |
        Shape of `ApiErrorResponse.details` when `code` is `provider_link_required` (ADR 009 §4).

        Naming the provider is safe here and nowhere else: this response is only reachable by a
        caller who has already proved control of the provider account for that address, so it
        discloses nothing they did not already hold. The UI uses it to say *which* button to press
        after signing in.
      required:
        - provider
      properties:
        provider:
          type: string
          enum: [FIREBASE_GOOGLE, GITHUB]
          description: The provider whose identity is waiting to be linked.
          example: FIREBASE_GOOGLE

    VersionConflictDetails:
      type: object
      description: |
        Shape of `ApiErrorResponse.details` when `code` is `version_conflict` (ADR 008).
        The client re-reads at `current_version`, re-applies its edit, and retries.
      required:
        - current_version
      properties:
        current_version:
          type: integer
          format: int32
          minimum: 0
          description: The version the server currently holds for the aggregate.
          example: 9
