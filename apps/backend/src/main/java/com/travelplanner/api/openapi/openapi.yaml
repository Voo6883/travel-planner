# Travel Planner API contract — THE single source of truth for both apps.
#
# Location is locked by PLAN §4.0.0.1: "OpenAPI lives in backend —
# apps/backend/src/main/java/.../api/openapi/ — single contract source".
#
# Design-first, not code-first: this file is hand-authored and the Java side is written to
# match it. `OpenApiSpecTest` fails the build when the two drift, and the CI codegen-drift
# gate fails the frontend build when the generated client is stale.
#
# ─────────────────────────────────────────────────────────────────────────────────────────
# Conventions every future path must follow (PLAN §6.1, §13.3)
# ─────────────────────────────────────────────────────────────────────────────────────────
#  · Base path lives in `servers`, so path keys are written WITHOUT the `/api/v1` prefix.
#    The generated client and NEXT_PUBLIC_API_BASE_URL both carry `/api/v1` exactly once.
#  · Verbs: GET / POST / PUT / DELETE only. PATCH is forbidden — partial updates are typed
#    POST actions under `/actions/` (ADR 008 §3).
#  · URL segments kebab-case; collections are plural nouns.
#  · Every mutation of a versioned aggregate composes `ExpectedVersion` into its request body
#    (ADR 008 §2). Concurrency never travels in a header.
#  · Every operation declares its error responses by $ref-ing `components/responses`.
#    New `code` values are registered in errors.yaml — see the procedure at its top.
#
# ─────────────────────────────────────────────────────────────────────────────────────────
# Codegen contract (ADR 007)
# ─────────────────────────────────────────────────────────────────────────────────────────
# `npm run codegen` regenerates apps/frontend/src/generated/api/schema.d.ts from this file,
# and CI fails if the committed output differs.
#
# The two chat paths added by tasks 20/21 —
#   POST /planner/chat/messages   and   POST /trips/{tripId}/chat/messages
# — are `text/event-stream` with a description-only body, and are EXCLUDED from the
# codegen-drift gate: no generator emits a usable SSE client, so their event union is
# hand-authored in `lib/api/chat-stream.ts` and mirrored by a backend sealed type.
# Mark such operations `x-sse-stream: true`. `OpenApiSpecTest.sseOperations...` enforces that
# a marked operation declares `text/event-stream` and nothing else, so the gate can never
# start demanding a generated client for it.

openapi: 3.0.3

info:
  title: Travel Planner API
  version: 1.0.0
  description: |
    Knowledge-grounded, chat-first trip planner.

    **Errors.** Every non-2xx response returns the `ApiErrorResponse` envelope
    `{ code, message, details }`. `code` is a registered `snake_case` identifier; the frontend
    maps it to `common.errors.<code>` and never displays `message` verbatim.

    **Request correlation.** Send `X-Request-Id` (a UUID) on every request. The server echoes
    it on every response — success and failure alike — and puts it in the log MDC. If the
    header is absent or malformed the server generates one.

    **Pagination.** List endpoints take `page`, `page_size` and `sort`, and return the item
    array alongside `page`, `page_size` and `total`.

    **Optimistic concurrency.** Mutations of versioned aggregates carry `expected_version` in
    the request body (ADR 008). A mismatch is `409 version_conflict`; a missing value is
    `400 validation_failed` and is never treated as a force-overwrite.
  license:
    name: UNLICENSED

servers:
  - url: /api/v1
    description: Same-origin path prefix. ADR 006 routes the browser through the Next.js proxy.

tags:
  - name: platform
    description: Liveness, readiness, and other non-product surfaces.
  - name: auth
    description: |
      Registration, sign-in, and the session model every identity provider shares (PLAN §4.0.5).

      **Transport.** The session is a pair of `httpOnly` cookies and never appears in a response
      body: `tp_session` carries a 30-minute signed access token, `tp_refresh` a 14-day opaque
      refresh token that is rotated on every use (ADR 009 §3). JavaScript cannot read either —
      the browser attaches them because `lib/api/client.ts` sends `credentials: 'include'`
      (ADR 006).

      **CSRF.** Because the credential is a cookie, every mutating call must echo the readable
      `XSRF-TOKEN` cookie in an `X-XSRF-TOKEN` header (ADR 006). That includes `/auth/login` and
      `/auth/register`: login CSRF — signing a victim into the attacker's account — is a real
      attack. Any `GET` seeds the cookie.

      **Enumeration.** `POST /auth/register` returns the identical body whether or not the address
      is already in use, and `POST /auth/login` returns one `invalid_credentials` for an unknown
      account and a wrong password alike (ADR 009 §6).
  - name: admin
    description: |
      Account administration (PLAN §4.0.6, UC-A15, UC-A16). Every operation requires the
      `ROLE_ADMIN` authority, which Spring Security derives from the stored role value `ADMIN`.

      **Accounts only.** An administrator manages *accounts* — list, view, enable/disable, reset
      password. There is deliberately no admin surface onto a user's trips, chats, bookings, or
      LLM content, and `TripRepositoryPort` has no unscoped lookup for one to be built on.

      **Every mutation is audited.** Actor, target, action, time, and result are written to
      `audit_event` in the same transaction as the change, so the trail can never claim a change
      that did not commit.

      **Mutations terminate sessions.** Disabling an account and resetting its password both bump
      `user.token_version` through the ADR 009 §1 revocation path. Without it a disabled or
      compromised account keeps working until its access token expires — unacceptable for an
      account that can spend money.
  - name: trips
    description: |
      The trip aggregate and its structured brief — C1 intake (PLAN §3.1, §4.1.3, UC-C1-01,
      UC-C1-04). Deterministic: nothing behind these paths calls a model. Task 19 adds LLM
      extraction on top of exactly these operations rather than beside them.

      **Ownership is structural.** No route here accepts a user id; the owner comes from the
      session cookie on every request, and `TripRepositoryPort` publishes no unscoped lookup for a
      service to reach past it with. A trip belonging to somebody else answers `404 not_found`,
      identically to one that does not exist, so this surface cannot confirm that another user's
      trip exists.

      **Two aggregates, two versions.** `trip` and `trip_brief` each carry their own optimistic
      lock (ADR 008 §1). `expected_version` always means the version of the resource in the path:
      the trip for a rename or an archive, the brief for a brief save. Saving a brief can change
      the trip's status and therefore advance the trip's version as a side effect — a client
      holding an older trip will correctly get `409` on its next rename, and the brief response
      carries the fresh status so the re-read is one field rather than one request.

      **Status is server-derived.** `trip.status` follows brief completeness and is never accepted
      in a request body. C2 stays blocked until `BRIEF_COMPLETE`, and that is a property of the
      data rather than a rule three call sites have to remember.

      **Never a silent guess.** An incomplete brief is answered with typed `clarification`
      questions carrying i18n prompt keys (UC-C1-04), not with defaults invented on the server.
  - name: destinations
    description: |
      The coverage catalogue of the Travel Knowledge Base (ADR 010 §4).

      **Coverage is explicit, never implied by a low score.** `destination.coverage_level` is
      `FULL`, `PARTIAL`, or `NONE`, and only `FULL` enters ranking. A request naming anything else
      is `404 destination_not_covered` carrying the supported list — it is never silently ranked
      low, because a destination with no seeded rows scores near zero on three of four terms and
      would be indistinguishable from a genuinely poor match.

      **Public.** The one surface here needs no session: it backs the destination picker a visitor
      sees before signing in, and it is the list the chat agent's "I do not cover that yet" has to
      name. It publishes a curated catalogue and nothing about any user.

  - name: chat
    description: |
      The chat transport shared by the planner home and every trip (PLAN §3.2, ADR 007, UC-C5-08,
      UC-C5-09). `POST` streams a turn, `GET` reads history — one path per surface, two verbs.

      **The stream is the product.** Token-by-token feedback is a locked UX property, which is why
      the transport is POST-SSE rather than polling, and why a failure after the response has
      committed to `200` arrives as an `event: error` frame rather than as a dropped connection.

      **Nothing here holds a database transaction.** A turn is three short write transactions with
      the model call strictly between them; a transaction spanning a stream would pin a pooled
      connection for the length of an answer and exhaust the pool under trivial load.

      **No hidden chain-of-thought, by construction.** `message.content` is user-visible text only,
      there is no role a reasoning trace could be persisted under, and the provider-event
      translation is an allow-list with no default branch — an event this project has not modelled
      has no frame to arrive in.
paths:
  /health:
    get:
      tags: [platform]
      operationId: getHealth
      summary: Liveness probe
      description: |
        Reports that the process is alive. Deliberately performs no dependency check — an
        unreachable database must not make the container look dead and trigger a restart loop.
      responses:
        '200':
          description: The process is alive.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /ready:
    get:
      tags: [platform]
      operationId: getReadiness
      summary: Readiness probe
      description: |
        Reports whether every readiness contributor is satisfied, so an orchestrator knows when
        to route traffic.

        This is the one endpoint whose failure response is **not** the error envelope: a
        not-ready process is a health verdict, not a request error, and the caller needs the
        per-component breakdown in both cases.
      responses:
        '200':
          description: Every contributor is ready.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: At least one contributor is not ready.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'

  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Create a local account (UC-A01)
      description: |
        Registers an email, username, and password.

        **The response is always the same.** `202 Accepted` with `status: PENDING_VERIFICATION`,
        whether the account was created, the address was already registered, or the username was
        taken (ADR 009 §6). A `201`/`409` split would answer "does this account exist?" for anyone
        who asked. The submitted address is told which case it was by email — the only channel the
        account owner controls (task 09).

        Validation failures are reported normally: a malformed email or a short password is the
        caller's own input and reveals nothing about anyone else.

        The new account starts `email_verified: false`, and UC-A08 blocks sign-in until it is
        confirmed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '202':
          description: The request was accepted. This says nothing about whether an account existed.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in with email or username (UC-A04)
      description: |
        Verifies a local password and issues the session.

        On success the response carries two `Set-Cookie` headers — `tp_session` and `tp_refresh` —
        and a body describing the user. Neither token is in the body.

        Failure modes, and why they differ:

        | Code | Meaning |
        |---|---|
        | `invalid_credentials` | Unknown identifier **or** wrong password. One code for both, so the endpoint cannot enumerate accounts |
        | `account_locked` | 5 failures in 15 minutes for this identifier from this address (ADR 009 §6) |
        | `email_not_verified` | Password correct, address unconfirmed (UC-A08). Distinguishable so the UI can offer "resend" |
        | `account_disabled` | Password correct, account switched off |

        The last two are raised only after the password has verified, so they tell nothing to a
        caller who does not already hold the credential.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/AuthSession'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/SignInForbidden'
        '423':
          $ref: '#/components/responses/AccountLocked'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/firebase:
    post:
      tags: [auth]
      operationId: authenticateWithFirebase
      summary: Sign up or sign in with a Google account (UC-A02, UC-A05)
      description: |
        One endpoint, three outcomes. The client obtains a Firebase ID token from
        `signInWithPopup(GoogleAuthProvider)` and posts it here; the server verifies it, resolves it
        to an account, and issues the same cookie session `/auth/login` issues (PLAN §4.0.5).

        | Outcome | Body |
        |---|---|
        | No identity for this Firebase uid and no account holds the address | `is_new_user: true` — the account is created `email_verified: true` and a welcome mail is sent |
        | The uid is already linked | `is_new_user: false`, `provider_linked: false` |
        | An account holds the address **and** both sides are verified | `is_new_user: false`, `provider_linked: true` |

        **The token is verified, not read** (ADR 004 Security). Two assertions beyond the signature
        are load-bearing, and both come from ADR 009 §4:

        - `aud` must equal the configured Firebase project id, so a token minted for a different
          project cannot sign anybody in here;
        - `firebase.sign_in_provider` must be `google.com`. Without it, switching on
          Email/Password in the Firebase console would open an unvetted registration path into this
          system — anyone could self-issue an identity for any address.

        **Auto-linking requires proof, not email equality.** If an account already holds the
        address but either side is unverified, the response is `409 provider_link_required` and
        *nothing is linked*. Treating a matching address as ownership is the documented pre-hijack
        takeover: an attacker registers locally as the victim's address, the victim later signs in
        with Google, and the attacker keeps password access to the victim's trips.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FirebaseAuthRequest'
      responses:
        '200':
          $ref: '#/components/responses/AuthSession'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/InvalidProviderToken'
        '403':
          $ref: '#/components/responses/ProviderSignInForbidden'
        '409':
          $ref: '#/components/responses/ProviderLinkConflict'
        '422':
          $ref: '#/components/responses/ProviderEmailUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'

  /auth/oauth/github/start:
    get:
      tags: [auth]
      operationId: startGithubOAuth
      summary: Begin the GitHub OAuth redirect (UC-A03, UC-A06)
      description: |
        Redirects the browser to GitHub's authorize URL with `client_id`, `scope=user:email`, and a
        single-use `state` (PLAN §4.0.5 step 2).

        `state` is CSRF protection, and it is only protection if the server remembers what it
        issued: the value is also written to a short-lived `tp_oauth_state` `httpOnly` cookie, and
        the callback accepts nothing that does not match it. The client secret never leaves the
        server — the browser only ever sees the authorize URL.

        `mode=link` starts the **explicit link confirmation** ADR 009 §4 requires when auto-linking
        is refused. It demands a live session, and the callback then attaches the GitHub identity to
        that account instead of signing anyone in.
      parameters:
        - name: mode
          in: query
          required: false
          description: |
            `sign_in` (default) or `link`. `link` requires an authenticated caller and is answered
            with `401 unauthorized` without one.
          schema:
            type: string
            enum: [sign_in, link]
            default: sign_in
      responses:
        '302':
          description: Redirect to GitHub, with the `state` cookie set.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Location:
              description: GitHub's authorize URL.
              required: true
              schema:
                type: string
            Set-Cookie:
              $ref: '#/components/headers/SetOAuthStateCookie'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/oauth/github/callback:
    get:
      tags: [auth]
      operationId: completeGithubOAuth
      summary: Complete the GitHub OAuth exchange (UC-A03, UC-A06)
      description: |
        GitHub redirects the browser here. The server validates `state` against the cookie, exchanges
        the authorization code for an access token **server-side**, reads the account, and issues the
        session cookies (PLAN §4.0.5 step 4).

        **Only the primary, verified address is used** (ADR 009 §4). `@users.noreply.github.com` and
        every unverified address are ignored, because an address a user has not confirmed is not
        evidence of anything and a `noreply` alias belongs to GitHub rather than to a person. An
        account whose address cannot be established can still sign in if its identity is already
        linked; it cannot be used to *create* one.

        Always answered with a redirect rather than JSON: the caller is a browser following GitHub's
        redirect, not a script reading a body. Failures redirect to the sign-in page with an
        `error` query parameter carrying the registered error code, so the frontend renders the same
        translated message it would for a JSON envelope.
      parameters:
        - name: code
          in: query
          required: false
          description: GitHub's single-use authorization code. Absent when the user declined.
          schema:
            type: string
            maxLength: 512
        - name: state
          in: query
          required: false
          description: Echo of the value issued by `/auth/oauth/github/start`.
          schema:
            type: string
            maxLength: 128
      responses:
        '302':
          description: |
            Signed in (or linked) and redirected into the app, with both session cookies set — or
            redirected to the sign-in page carrying `?error=<code>` when the exchange failed.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Location:
              description: A frontend URL. Never a provider URL, and never one supplied by the caller.
              required: true
              schema:
                type: string
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookies'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/providers/{provider}:
    parameters:
      - $ref: '#/components/parameters/ProviderParam'

    post:
      tags: [auth]
      operationId: linkProvider
      summary: Confirm linking a provider to the signed-in account (UC-A09)
      description: |
        The explicit, authenticated confirmation ADR 009 §4 requires wherever auto-linking is
        refused. Being signed in is the proof of ownership that a matching email address is not:
        the caller holds a session for the existing account *and* a credential the provider just
        verified, so both halves are demonstrated rather than inferred.

        The account's email address is not consulted at all on this path — linking a provider whose
        address differs from the account's is allowed and expected.

        `409 identity_already_linked` when the provider identity belongs to another account, or when
        this account already has an identity for the provider. One external identity may never
        resolve to two users; the unique index on `(provider, provider_subject_id)` is the final
        arbiter and this check is the readable one in front of it. Re-linking the *same* identity to
        the same account is a no-op and succeeds.

        `GITHUB` is not accepted here: its credential is a single-use authorization code the browser
        never holds. Link GitHub through `GET /auth/oauth/github/start?mode=link` instead.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkProviderRequest'
      responses:
        '204':
          description: |
            The provider is linked. No body: the client re-reads `GET /auth/me`, which is the one
            place `linked_providers` is published.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProviderSignInForbidden'
        '409':
          $ref: '#/components/responses/ProviderLinkConflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'

    delete:
      tags: [auth]
      operationId: unlinkProvider
      summary: Unlink a provider from the signed-in account (ADR 009 §4)
      description: |
        **Refused when it would leave the account with no usable sign-in method** —
        `409 last_sign_in_method`. A local password counts as a method only when one is set, so a
        Google-only account cannot unlink Google and lock itself out permanently.

        **Every session is terminated** (`PROVIDER_UNLINKED`, ADR 009 §1). Removing a way into an
        account is a security event, and the case it exists for is "that provider account is no
        longer mine" — which is exactly when sessions obtained through it must stop working now
        rather than at their next expiry. Both cookies are therefore cleared and the caller signs in
        again.

        `LOCAL` is rejected with `400 validation_failed`: the row is bookkeeping, and deleting it
        would not remove the password it stands for. Changing or removing a password is
        `PUT /auth/password`.

        `404 not_found` when the account never linked the provider — the same code an unowned
        resource returns.
      security:
        - cookieAuth: []
      responses:
        '204':
          description: The provider is unlinked and every session for the account has ended.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookies'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ProviderLinkConflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Exchange the refresh cookie for a new session (ADR 009 §3)
      description: |
        Rotates `tp_refresh` and issues a fresh `tp_session`. The refresh cookie is the credential,
        so this endpoint needs no valid access token — by the time a client calls it, the access
        token has expired.

        **Rotation is single-use.** Presenting a token that was already exchanged is treated as
        theft: the whole token family is revoked, `token_version` is bumped so every outstanding
        access token for the account stops working, and a security event is logged. Both the thief
        and the legitimate client are signed out, because there is no way to tell which is which.

        A missing, unknown, expired, revoked, or replayed token all return the same `unauthorized`.
      responses:
        '200':
          $ref: '#/components/responses/AuthSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End this session (UC-A10)
      description: |
        Clears both cookies **and** invalidates the refresh token server-side. Clearing a cookie
        alone is not revocation — the token in a copied cookie jar would keep working for the rest
        of its fourteen days (ADR 009 §3).

        Idempotent, and public: it must succeed for a caller whose access token has already
        expired. A logout that can fail is one users learn to skip.
      responses:
        '204':
          description: Signed out. Both session cookies are cleared.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookies'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/logout-all:
    post:
      tags: [auth]
      operationId: logoutAll
      summary: Sign out of every device (ADR 009 §5)
      description: |
        Bumps `token_version` and revokes every stored refresh token for the account, so access
        tokens already in flight fail on their next request rather than at their next expiry.

        This is the user-facing half of the revocation mechanism that admin disable, password
        change, and account deletion also use (ADR 009 §1).
      security:
        - cookieAuth: []
      responses:
        '204':
          description: Every session for this account has been terminated.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookies'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/verify-email/confirm:
    post:
      tags: [auth]
      operationId: confirmEmailVerification
      summary: Confirm an email address from the mailed link (UC-A08, ADR 009 §5)
      description: |
        Consumes the single-use token from the verification mail and sets `email_verified: true`.

        Public, because the whole point of the flow is that the account cannot sign in yet. The
        token is the credential: it is 256 random bits, stored only as a SHA-256 digest, and it is
        marked spent in the same statement that validates it, so a link that is clicked twice —
        by the user, by a mail scanner, by a browser prefetch — succeeds exactly once.

        Unknown, expired, and already-used tokens all return one `invalid_token`. Distinguishing
        them would confirm that a given token once existed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmEmailVerificationRequest'
      responses:
        '204':
          description: The address is verified. The caller may now sign in.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '400':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/verify-email/resend:
    post:
      tags: [auth]
      operationId: resendEmailVerification
      summary: Send the verification mail again (UC-A13)
      description: |
        **The response is always the same** — `202` with `status: ACCEPTED` — whether the address is
        registered, unregistered, already verified, or belongs to an account that signs in only
        through a provider (ADR 009 §6). The mail, which only the address owner can read, is the
        channel that says which.

        Rate-limited per email **and** per client address (ADR 009 §6). The limit is keyed on the
        submitted string rather than on an account, so hitting it reveals nothing about whether an
        account exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailOnlyRequest'
      responses:
        '202':
          $ref: '#/components/responses/MailRequestAccepted'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/password/forgot:
    post:
      tags: [auth]
      operationId: forgotPassword
      summary: Request a password-reset link (UC-A07)
      description: |
        Sends a single-use reset link that expires in one hour (ADR 004).

        **Uniform, and deliberately unhelpful to a stranger.** `202` with `status: ACCEPTED` for a
        registered address, an unregistered one, and an account that has no local password alike.

        An account created through Google or GitHub has `password_hash IS NULL`. This endpoint does
        **not** mint a local password for it (ADR 009 §4) — that would turn "I know your email" into
        a second way into the account. It sends a "sign in with your provider" mail instead, and
        returns the same body as every other case.

        Rate-limited per email and per client address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailOnlyRequest'
      responses:
        '202':
          $ref: '#/components/responses/MailRequestAccepted'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/password/reset:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: Set a new password from a reset link (UC-A07)
      description: |
        Consumes the single-use reset token and stores the new password.

        **Every session for the account is terminated** (ADR 009 §1): `token_version` is bumped and
        every stored refresh token is revoked. Anyone still holding a session from before the reset
        — which, in the case this flow exists for, is the attacker — stops working on their next
        request rather than at their next token expiry.

        A confirmation mail is sent afterwards, so a reset the account owner did not perform is
        visible to them immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: The password was replaced and every session was terminated.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '400':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/password:
    put:
      tags: [auth]
      operationId: changePassword
      summary: Change your own password (UC-A12)
      description: |
        Requires the current password, so a borrowed unlocked browser cannot silently take over the
        account.

        **Every session is terminated, including this one** (ADR 009 §1). That is the point of the
        feature: a user who changes their password because they believe they were compromised is
        telling the system to evict everyone. The response therefore clears both session cookies,
        and the client must sign in again.

        `PUT` rather than `POST` because the endpoint replaces one field of the caller's own
        account; `PATCH` is forbidden project-wide (ADR 008 §3).
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: The password was replaced and every session, including this one, was ended.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookies'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: The signed-in user and their linked providers (UC-A11)
      description: |
        Source for `useUserContext()` on the frontend (ADR 002).

        Read from the database on every call, never from token claims (ADR 009 §2). That is what
        makes `email_verified` trustworthy: a claim minted at sign-in would still say `false` for
        up to thirty minutes after the user clicked the verification link.

        Also seeds the `XSRF-TOKEN` cookie, so a freshly loaded page can make its first mutating
        request (ADR 006) — though any `GET` will do that.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: The authenticated caller.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [auth]
      operationId: deleteCurrentUser
      summary: Delete your own account (UC-A14)
      description: |
        **Soft delete with PII anonymisation.** The row survives — trips, itineraries, and audit
        records reference it by id, and a hard delete would either cascade real user data away or
        leave dangling references. What is erased is everything that identifies a person: the email
        becomes an unroutable placeholder, the username is released, and the password hash is
        dropped so no credential remains.

        `deleted_at` is stamped, `enabled` is set to false, and every session is terminated
        (ADR 009 §1). Without that last step a deleted account's cookie would keep authenticating
        until it expired.

        Irreversible from the API. There is no undelete endpoint, and the anonymised row cannot be
        signed into by any provider.
      security:
        - cookieAuth: []
      responses:
        '204':
          description: The account is anonymised and every session is terminated.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookies'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/users:
    get:
      tags: [admin]
      operationId: listAdminUsers
      summary: List every account (UC-A15)
      description: |
        Paginated over all accounts, including disabled and closed ones — an administrator who
        cannot see a disabled account cannot re-enable it.

        `sort` accepts **`created_at`** only, with or without the `-` prefix; any other field is
        `400 validation_failed`. Publishing one field rather than the whole row is deliberate: each
        sortable column is an index this table would have to carry, and none of the others has a
        use case.

        Returns account state only. Nothing here exposes a user's trips, chats, or bookings.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - $ref: '#/components/parameters/SortParam'
      responses:
        '200':
          description: One page of accounts, newest first by default.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserPage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/users/{userId}:
    get:
      tags: [admin]
      operationId: getAdminUser
      summary: One account's administrative detail (UC-A15)
      description: |
        The same account state the list carries, plus the sign-in methods attached to it. Read from
        current database state, so a session revoked a moment ago is already reflected.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '200':
          description: The requested account.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags: [admin]
      operationId: updateAdminUser
      summary: Enable or disable an account (PLAN §4.0.6)
      description: |
        **Disabling terminates every session for the account** (ADR 009 §1). The `token_version`
        bump is what makes "disabled" mean disabled now rather than within thirty minutes, and it
        is why this is not a cosmetic flag.

        An administrator may not disable their own account: it would remove the only role able to
        re-enable it, and a lockout with no recovery path is a worse outcome than the mistake it
        would be protecting against. That is `403 forbidden`.

        A closed account (UC-A14) is `409 account_closed` — it holds no credential, so there is
        nothing left to switch off.

        `PUT`, not `PATCH`: `PATCH` is forbidden project-wide (ADR 008 §3). No `expected_version`,
        because `user` is not a versioned aggregate (ADR 008 §1).
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAdminUserRequest'
      responses:
        '200':
          description: The updated account. Sessions are already terminated when it was disabled.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserDetail'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          $ref: '#/components/responses/AccountClosed'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/users/{userId}/reset-password:
    put:
      tags: [admin]
      operationId: resetAdminUserPassword
      summary: Set a temporary password for an account (UC-A16)
      description: |
        The administrator chooses the replacement and communicates it out of band; there is no
        endpoint that reads it back, and it is never echoed in a response or a log.

        **Every session for the account is terminated** (ADR 009 §1). This action exists for the
        "that account is compromised" case, and a reset that leaves the intruder's session live
        would achieve nothing.

        An account with no local password (`FIREBASE_GOOGLE` or `GITHUB` only, ADR 009 §4) is not
        addressable here — `409 account_closed` covers a closed account, and a provider-only
        account is refused as `400 validation_failed`, because minting a local password for it
        would add a second way in that its owner never chose.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminResetPasswordRequest'
      responses:
        '204':
          description: The password was replaced and every session for the account was ended.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          $ref: '#/components/responses/AccountClosed'
        '500':
          $ref: '#/components/responses/InternalError'

  /destinations/supported:
    get:
      tags: [destinations]
      operationId: listSupportedDestinations
      summary: Every destination the knowledge base fully covers (ADR 010 §4)
      description: |
        The `FULL` coverage list, and therefore the exact set of destinations that may enter C2
        ranking. Anything absent from it is `404 destination_not_covered` wherever it is named.

        **No session required.** The picker renders this before a visitor has one, and the chat
        agent quotes it when refusing an uncovered city. A 401 here would make both impossible,
        and the catalogue is curated public data — three cities in v1 (ADR 010 §1).

        **Not paginated.** The whole list is small by design and the refusal path has to carry it
        inline, so it is returned whole rather than a page at a time.

        Destinations are identified by `slug` only. The surrogate `destination.id` stays
        server-side: the slug is what the seeds, the URLs, and `destination_not_covered`'s
        `details.supported` already use, and a second identifier would only split clients between
        the two.
      responses:
        '200':
          description: Every fully covered destination, in a stable order. Empty when none is curated.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportedDestinations'
        '500':
          $ref: '#/components/responses/InternalError'

  /destinations/{destinationId}/guide:
    get:
      tags: [destinations]
      operationId: getDestinationGuide
      summary: Destination guide detail (areas, POIs, apps)
      description: |
        Full knowledge-backed guide for a destination — overview/food/practical narrative, areas,
        top POIs, transport modes, and the locale app pack (PLAN §4.1). Used by the research detail
        drawer and as chat context.

        Requires a session. An unknown `destinationId` is `404 not_found`. Missing narrative
        sections are omitted (null) rather than fabricated.
      security:
        - cookieAuth: []
      parameters:
        - name: destinationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: locale
          in: query
          required: false
          schema:
            type: string
            default: en
            enum: [en, ms]
      responses:
        '200':
          description: Destination guide detail.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DestinationGuideDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /trips:
    get:
      tags: [trips]
      operationId: listTrips
      summary: The caller's trips (UC-C1-01)
      description: |
        Every trip owned by the caller, newest first.

        **Not paginated.** One person's trips are a list they scroll, not a corpus, and shipping
        `page`/`page_size`/`total` that no client would vary is three fields of ceremony. The key
        stays `trips` if that ever changes.

        Each item carries its `version`, because a client that lists trips is one rename away from
        needing it and ADR 008 §1 requires the read before a write to supply it.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: The caller's trips, newest first. Empty for a new account.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [trips]
      operationId: createTrip
      summary: Create a trip (UC-C1-01)
      description: |
        Creates a `DRAFT` trip and its empty brief in one transaction, in the documented lock order
        (`trip` then `trip_brief`). A trip whose brief row was missing would make every later read
        a "does it exist yet?" branch, and an empty brief is precisely what `DRAFT` means.

        The owner comes from the session cookie and is never in the body: an actor a request can
        assert is not an actor anything may be attributed to.

        No `expected_version` — ADR 008 versions edits to existing state, and there is none here
        for a concurrent writer to have replaced.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTripRequest'
      responses:
        '201':
          description: |
            The new trip, including the `version` its first brief save will have to echo — so the
            client does not need a second request to obtain it.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /trips/{tripId}:
    get:
      tags: [trips]
      operationId: getTrip
      summary: One trip
      description: |
        A trip owned by somebody else answers `404 not_found`, identically to one that does not
        exist. `TripRepositoryPort` publishes no unscoped lookup, so the two cases are
        indistinguishable here by construction rather than by discipline — a `403` would confirm
        that another user's trip exists to anyone who asked.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TripIdParam'
      responses:
        '200':
          description: The requested trip.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags: [trips]
      operationId: renameTrip
      summary: Rename a trip
      description: |
        The name is the only field a client may write on the trip row.

        **There is no `status` in the body, deliberately.** `trip.status` is derived from brief
        completeness by `PUT .../brief`, and moved to `ARCHIVED` by the archive action. A client
        able to set it directly could declare `BRIEF_COMPLETE` over an empty brief and walk past
        the gate PLAN §3.1 puts in front of C2.

        An archived trip is read-only for every actor, the agent included, so a rename on one is
        `400 validation_failed`.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TripIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameTripRequest'
      responses:
        '200':
          $ref: '#/components/responses/TripMutated'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [trips]
      operationId: deleteTrip
      summary: Delete a trip
      description: |
        Removes the trip and, by `ON DELETE CASCADE`, its brief.

        **No `expected_version`, and that is a decision rather than an omission.** ADR 008 versions
        writes that are *based on* prior content, so the loser of a race can re-read and re-apply
        its edit. A delete is based on nothing and has nothing to re-apply: the caller's intent is
        "this trip should not exist", and that does not become wrong because the agent changed a
        field a moment earlier. Carrying the version would also mean a request body on `DELETE`,
        which intermediaries are entitled to drop — a concurrency control that silently stops
        working behind some proxies is worse than none.

        `404` for a trip that is not the caller's, so a delete cannot be used to probe for one.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TripIdParam'
      responses:
        '204':
          description: The trip and its brief are gone. Nothing in the body — no resource is left.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /trips/{tripId}/actions/archive:
    post:
      tags: [trips]
      operationId: archiveTrip
      summary: Archive a trip
      description: |
        Moves the trip to `ARCHIVED`, after which it is view-only for every actor, the agent
        included (PLAN §3.1).

        A typed action rather than a `status` field on `PUT` (ADR 008 §3). Archiving is not a field
        edit, and giving it the same request shape as a rename is how one gets sent by accident.

        Not idempotent: archiving an already-archived trip is `400 validation_failed`, because the
        second call is a client acting on a stale view and ADR 008's whole position is that such a
        client should be told rather than quietly agreed with.

        It still carries `expected_version` — making a trip read-only while the agent is mid-edit
        loses that edit like any other write does.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TripIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveTripRequest'
      responses:
        '200':
          $ref: '#/components/responses/TripMutated'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /trips/{tripId}/brief:
    get:
      tags: [trips]
      operationId: getTripBrief
      summary: Read the trip brief and its outstanding questions (UC-C1-01, UC-C1-04)
      description: |
        The brief, the trip's status, and the clarification questions the brief still needs — in
        one response, because they are only consistent together. A client that fetched the brief
        and the status separately would, between the two calls, see a `BRIEF_COMPLETE` trip beside
        a brief the agent had just re-opened, and would render a "start research" button the server
        then refuses.

        This is the read that precedes every write, so it is the read that supplies the `version`
        those writes must echo (ADR 008 §1). `version` here is the **brief's**; the trip carries its
        own, and the two advance independently.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TripIdParam'
      responses:
        '200':
          $ref: '#/components/responses/TripBriefState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags: [trips]
      operationId: updateTripBrief
      summary: Save the whole trip brief (UC-C1-01)
      description: |
        The whole-body save the debounced intake form issues (PLAN §4.2).

        **An omitted field clears it.** This is a `PUT` of the whole resource, not a merge:
        `PATCH` is forbidden project-wide (ADR 008 §3), and a `PUT` that read absence as "leave
        unchanged" would give a client no way at all to un-set a field it entered by mistake. To
        change one field without re-sending the rest, use the clarification action below — the
        typed diff ADR 008 §3 exists for exactly that.

        **The response is the new full resource** (ADR 008 §2), including the incremented `version`,
        the recomputed `clarification`, and the trip `status` the save moved the trip to. Status is
        computed from the saved brief on every write, so no request can declare `BRIEF_COMPLETE`
        over a brief that is not.

        **Destination preference is checked against coverage.** A slug the knowledge base has never
        curated is `404 destination_not_covered` carrying `details.supported` (ADR 010 §4) — it is
        never accepted and then ranked near zero, which would read to the user as "we considered it
        and it is a poor match" when the truth is that nobody ever looked. An empty `destinations`
        is a legitimate answer meaning "no preference", and lets C2 rank the whole covered set.

        The status the save can move the trip to is limited to `CLARIFICATION_NEEDED` and
        `BRIEF_COMPLETE`, and a trip that has already left the intake phase is refused with
        `400 validation_failed` rather than dragged back into it.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TripIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTripBriefRequest'
      responses:
        '200':
          $ref: '#/components/responses/TripBriefState'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TripBriefNotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /trips/{tripId}/brief/actions/answer-clarification:
    post:
      tags: [trips]
      operationId: answerTripBriefClarification
      summary: Answer outstanding clarification questions (UC-C1-04)
      description: |
        Applies typed answers to the fields their questions were asked about, then re-validates —
        the brief either completes or returns a shorter list of questions.

        **A typed `POST` action, not a `PUT`** (ADR 008 §3). PLAN §4.1.3 sketched this as
        `PUT .../brief/clarification`; the ADR supersedes that, and the reason is the one it gives:
        re-sending nine brief fields to answer one question means eight of them were read some time
        ago, and each is a chance to overwrite something the agent changed since — from a form
        control the user never touched.

        Three things are refused rather than ignored, because a silently dropped answer is
        indistinguishable to the user from one the server accepted and then lost:

        - an answer to a question that is not outstanding — it was already answered or never asked,
          and applying it would make this endpoint a second, unvalidated way to write arbitrary
          brief fields;
        - an answer whose value type does not match the question's `type`;
        - two answers to the same question, where "last one wins" would be a coin toss.

        No coverage check: no clarification question sets a destination, so none can name an
        uncovered one.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TripIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerClarificationRequest'
      responses:
        '200':
          $ref: '#/components/responses/TripBriefState'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /trips/{tripId}/research/run:
    post:
      tags: [trips]
      operationId: startResearch
      summary: Start a research run for a trip (UC-C2-01)
      description: |
        Starts the C2 research agent for the trip and returns **immediately** with the queued job
        (PLAN §3.1, USE-CASES UC-C2-01). The run is long — up to the §14 90-second budget — so it
        happens on a background worker; the client polls `GET .../research/jobs/{jobId}` for
        progress rather than holding this connection open.

        **`202 Accepted`, not `200`.** The response says the work was accepted, not finished:
        `status` is `queued`, and the trip moves to `RESEARCH_QUEUED` in the same transaction that
        persists the job — before any worker is handed it, so a run is never dispatched against a
        row that did not commit.

        **The gate is `BRIEF_COMPLETE`.** Research may begin only from a complete brief (the C2
        unlock rule); any other trip status is `400 validation_failed` on `status`. A trip that
        already has an active (queued or running) job is refused the same way — one run at a time.
        Re-running after a previous run finished creates a **new** job and keeps the old one as
        history (UC-C2-07).
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TripIdParam'
      responses:
        '202':
          $ref: '#/components/responses/ResearchJobAccepted'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /trips/{tripId}/research/jobs/{jobId}:
    get:
      tags: [trips]
      operationId: getResearchJob
      summary: Poll a research job (UC-C2-02)
      description: |
        The current state of a research run: `status` (`queued|running|completed|failed`),
        `progress_pct` while running, and `error_code` when it failed (USE-CASES UC-C2-02).

        The frontend polls this while the job is `queued` or `running` and stops once it is
        terminal. A failed job carries a typed `error_code` (for example `research_timeout`) and
        leaves the trip recoverable — the trip returns to `BRIEF_COMPLETE`, never a trip-level
        "failed" state, so a re-run is always possible.

        A job id that is not this trip's, or a trip that is not the caller's, is `404 not_found` —
        indistinguishable, so this cannot be used to probe for another user's data.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TripIdParam'
        - $ref: '#/components/parameters/JobIdParam'
      responses:
        '200':
          $ref: '#/components/responses/ResearchJobState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /trips/{tripId}/ranked-recommendations:
    get:
      tags: [trips]
      operationId: listRankedRecommendations
      summary: List ranked destination recommendations (UC-C2-03)
      description: |
        Returns the latest durable research outcome for the trip when `trip.status` is
        `RESEARCH_READY`, or `DESTINATION_SELECTED` with a persisted selection (UC-C2-03/05).

        Each recommendation carries rationale, estimated cost, score breakdown, traveler guide,
        risks, freshness/confidence terms, and `source_refs` — never recomputed in the client.

        When the DSA produced no confident match, `no_confident_result` is `true` and
        `recommendations` is empty (typed empty — never a hallucinated apology).

        Otherwise: `409 research_not_ready`. Ownership failures are `404 not_found`.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TripIdParam'
      responses:
        '200':
          description: Latest research outcome for the trip.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RankedRecommendations'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResearchNotReady'
        '500':
          $ref: '#/components/responses/InternalError'

  /trips/{tripId}/selected-recommendation:
    post:
      tags: [trips]
      operationId: selectRecommendation
      summary: Select a destination recommendation (UC-C2-06)
      description: |
        Persists `selected_recommendation_id` and moves the trip
        `RESEARCH_READY → DESTINATION_SELECTED` atomically.

        The recommendation must belong to the trip's latest research run. Selecting when the trip
        is not `RESEARCH_READY` is `400 validation_failed` on `status`. A concurrent writer may
        receive `409 version_conflict`.

        **No optimistic UI.** The client waits for this response before showing the selected state.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TripIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectRecommendationRequest'
      responses:
        '200':
          description: Trip after selection.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /planner/chat/messages:
    post:
      tags: [chat]
      operationId: sendPlannerChatMessage
      summary: Send a planner message and stream the assistant turn (UC-C5-08)
      x-sse-stream: true
      description: |
        Commits the user's message and streams the assistant's reply as Server-Sent Events
        (ADR 007).

        **`POST`, not `EventSource`.** `EventSource` is GET-only and cannot set headers, so it can
        carry neither this body nor the `X-XSRF-TOKEN` that ADR 006 requires. Send
        `Accept: text/event-stream, application/json` — the stream type is what selects this
        operation, and `application/json` is what lets a refusal reach you as the §6.1 envelope
        rather than as a status with an empty body. A caller that accepts only the stream type gets
        the status and nothing to render.

        **The first planner turn creates the conversation.** Send no `conversation_id`; the server
        resolves the caller's open `planner_session`, opens one if there is none, and returns the
        thread's id in `X-Conversation-Id`.

        **Every refusal is still HTTP.** The turn is opened — conversation resolved, user message
        committed, assistant row reserved — before the response commits to `200`. An archived
        thread, a trip that is not yours, or a body that does not validate is answered with a
        status. After `200` the envelope can only travel in-band, as `event: error`.

        **Retrying is safe.** Re-send with the same `client_message_id` and the committed message
        is reused rather than duplicated; the assistant turn is generated again, because the
        previous one was marked `interrupted` when the connection dropped.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendChatMessageRequest'
      responses:
        '200':
          $ref: '#/components/responses/ChatEventStream'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      tags: [chat]
      operationId: listPlannerChatMessages
      summary: Read planner chat history (UC-C5-08)
      description: |
        One page of the caller's planner conversation.

        **Page 0 is the newest page.** A chat panel opens at the bottom and pages backwards, so
        page 1 means "the messages before the ones on screen", not "the second thing that ever
        happened". The `page`/`page_size`/`total` envelope and its validation are the platform's
        (PLAN §6.1) — zero-based, default 20, rejected rather than clamped above 100 — only the
        anchor differs, and it is documented here because the shape cannot express it.

        **Within a page the order is the server's `seq`, ascending, always.** There is no `sort`
        parameter: `seq` is the only ordering the schema can guarantee, and offering a choice would
        publish one the endpoint does not have.

        A caller with no conversation yet gets an empty page and a null `conversation_id`.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - $ref: '#/components/parameters/ConversationIdParam'
      responses:
        '200':
          $ref: '#/components/responses/ChatHistory'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /trips/{tripId}/chat/messages:
    post:
      tags: [chat]
      operationId: sendTripChatMessage
      summary: Send a message in a trip's conversation and stream the reply (UC-C5-09)
      x-sse-stream: true
      description: |
        The same transport as the planner path, against the trip's one persistent conversation
        (PLAN §3.2). The conversation is created on first use; a trip that is not the caller's is
        `404 not_found`, identically to one that does not exist.

        See `sendPlannerChatMessage` for the `Accept` header, the idempotency rule, and why every
        refusal is still an HTTP status.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TripIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendChatMessageRequest'
      responses:
        '200':
          $ref: '#/components/responses/ChatEventStream'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      tags: [chat]
      operationId: listTripChatMessages
      summary: Read a trip's chat history (UC-C5-09)
      description: |
        One page of the trip's conversation. Paging, ordering, and the newest-page-first anchor are
        exactly as `listPlannerChatMessages` documents them.

        An owned trip that has never been chatted about returns an empty page; a trip that is not
        the caller's returns `404`, so an empty history can never be used to confirm that somebody
        else's trip exists.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TripIdParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - $ref: '#/components/parameters/ConversationIdParam'
      responses:
        '200':
          $ref: '#/components/responses/ChatHistory'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:

  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: tp_session
      description: |
        The session cookie from ADR 002 — `httpOnly`, `SameSite=Lax`, and `Secure` in production.

        Documented as `apiKey in cookie` because OpenAPI 3.0 has no vocabulary for "the browser
        sends this automatically". No client ever sets this header or reads this value: it is
        `httpOnly`, and `lib/api/client.ts` relies on `credentials: 'include'` instead (ADR 006).

  headers:

    SetSessionCookies:
      description: |
        `tp_session` and `tp_refresh`, set or cleared. Two `Set-Cookie` headers are always sent
        together — a cleared pair repeats the original name, path, `Secure`, and `SameSite`,
        because a browser matches on all of them and a mismatched clear leaves the cookie in place.
      required: true
      schema:
        type: string

    SetOAuthStateCookie:
      description: |
        `tp_oauth_state`, the single-use CSRF value for one GitHub round trip. `httpOnly` and
        scoped to `/api/v1/auth/oauth`, with a lifetime measured in minutes — it is a nonce for one
        redirect, not a session.
      required: true
      schema:
        type: string

    XRequestId:
      description: |
        Correlation id echoed from the request, or generated when the caller sent none.
        Present on every response, including errors — it is how a user-reported failure is
        found in the logs.
      required: true
      schema:
        type: string
        format: uuid

    XConversationId:
      description: |
        The conversation the turn was appended to. Present so a client that let the server open a
        planner conversation can address it immediately, without a second request — it cannot go in
        the body, because the body is a stream.
      required: true
      schema:
        type: string
        format: uuid

    XAccelBuffering:
      description: |
        Always `no`. nginx and several CDNs buffer an upstream response by default, which for SSE
        means the user sees nothing at all until the turn is over — the one failure mode that makes
        streaming pointless while looking like it works.
      required: true
      schema:
        type: string

  parameters:
    ConversationIdParam:
      name: conversation_id
      in: query
      required: false
      description: |
        Read a specific conversation rather than the surface's current one. Must be the caller's and
        must belong to the addressed surface; anything else is `404 not_found`, so this cannot be
        used to probe for another user's threads.
      schema:
        type: string
        format: uuid

    ProviderParam:
      name: provider
      in: path
      required: true
      description: |
        The sign-in method, exactly as `CurrentUser.linked_providers` publishes it. `LOCAL` is
        addressable so that an unsupported operation on it is a registered `validation_failed`
        rather than a 404 that reads like a routing mistake.
      schema:
        type: string
        enum: [LOCAL, FIREBASE_GOOGLE, GITHUB]

    UserIdParam:
      name: userId
      in: path
      required: true
      description: |
        The account's surrogate key. Supplied by the administrator, never by the account owner —
        no non-admin endpoint anywhere on this API accepts a user id, because ownership always
        comes from the session cookie.
      schema:
        type: string
        format: uuid

    TripIdParam:
      name: tripId
      in: path
      required: true
      description: |
        The trip's surrogate key. Ownership is *not* carried here — it comes from the session on
        every request, and an id that is not the caller's is answered `404 not_found` rather than
        `403`, so this parameter cannot be used to probe for another user's trips.
      schema:
        type: string
        format: uuid

    JobIdParam:
      name: jobId
      in: path
      required: true
      description: |
        A research job's surrogate key, as returned by `startResearch`. Ownership is not carried
        here — it comes from the session and the trip on the path; a job that is not the addressed
        trip's is `404 not_found`.
      schema:
        type: string
        format: uuid

    PageParam:
      name: page
      in: query
      required: false
      description: Zero-based page index (PLAN §6.1).
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0

    PageSizeParam:
      name: page_size
      in: query
      required: false
      description: Items per page. Values above the maximum are rejected, never clamped.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20

    SortParam:
      name: sort
      in: query
      required: false
      description: |
        Sort field, optionally prefixed with `-` for descending. Endpoints publish their own
        allowed field names; an unknown field is `400 validation_failed`.
      schema:
        type: string
        pattern: '^-?[a-z][a-z0-9_]*$'
        default: '-created_at'

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [UP]
          description: Always `UP`; a process that cannot answer is not alive.

    ReadinessResponse:
      type: object
      required: [status, components]
      properties:
        status:
          type: string
          enum: [UP, DOWN]
        components:
          type: object
          additionalProperties:
            type: string
          description: |
            Contributor name → verdict. `UP`, or `DOWN: <reason>` with a reason that carries no
            credentials, host names, or stack traces.
          example:
            process: UP
            database: UP

    ApiErrorResponse:
      $ref: './errors.yaml#/components/schemas/ApiErrorResponse'

    ErrorCode:
      $ref: './errors.yaml#/components/schemas/ErrorCode'

    ValidationFailedDetails:
      $ref: './errors.yaml#/components/schemas/ValidationFailedDetails'

    VersionConflictDetails:
      $ref: './errors.yaml#/components/schemas/VersionConflictDetails'

    AccountLockedDetails:
      $ref: './errors.yaml#/components/schemas/AccountLockedDetails'

    RateLimitedDetails:
      $ref: './errors.yaml#/components/schemas/RateLimitedDetails'

    ProviderLinkRequiredDetails:
      $ref: './errors.yaml#/components/schemas/ProviderLinkRequiredDetails'

    DestinationNotCoveredDetails:
      $ref: './errors.yaml#/components/schemas/DestinationNotCoveredDetails'

    RegisterRequest:
      type: object
      description: Local sign-up (UC-A01). All three fields are required.
      required: [email, username, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
          description: Compared case-insensitively; `ux_user_email_lower` enforces uniqueness.
          example: aisyah@example.com
        username:
          type: string
          minLength: 3
          maxLength: 64
          pattern: '^[A-Za-z0-9._-]+$'
          description: |
            Letters, digits, dot, underscore, and hyphen. **May not contain `@`** — login accepts
            an email *or* a username on one field, and a username shaped like somebody else's
            address would make that field ambiguous (ADR 009 §4).
          example: aisyah
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: |
            Minimum 8 characters (PLAN §4.0.9), stored as a BCrypt hash at strength 12. The
            72-character ceiling is BCrypt's own: it hashes the first 72 bytes and ignores the
            rest, so a longer value would authenticate a password the user did not choose.
      example:
        email: aisyah@example.com
        username: aisyah
        password: correct-horse-battery

    LoginRequest:
      type: object
      description: Local sign-in (UC-A04). Matches PLAN §4.0.5's `LocalLoginRequest`.
      required: [login, password]
      properties:
        login:
          type: string
          maxLength: 320
          description: |
            Email **or** username. The server decides which by looking for `@`, which a username
            cannot contain (ADR 009 §4). Both are matched case-insensitively.
          example: aisyah
        password:
          type: string
          format: password
          maxLength: 200
      example:
        login: aisyah
        password: correct-horse-battery

    RegistrationResponse:
      type: object
      description: |
        Deliberately constant. Any field that varied with whether the account already existed
        would be the enumeration oracle ADR 009 §6 closes.
      required: [status]
      properties:
        status:
          type: string
          enum: [PENDING_VERIFICATION]
          description: Always this value. The account owner learns the real outcome by email.

    EmailOnlyRequest:
      type: object
      description: |
        The body of every "send me a mail about this address" endpoint — forgot-password and
        resend-verification. One schema for both, because the two must be indistinguishable in
        every observable way and a shared shape is the cheapest guarantee of that.
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
          description: |
            Compared case-insensitively. Never confirmed or denied — a syntactically valid address
            that belongs to nobody produces the same `202` as one that does.
          example: aisyah@example.com
      example:
        email: aisyah@example.com

    ConfirmEmailVerificationRequest:
      type: object
      description: The single-use token from the verification mail (UC-A08).
      required: [token]
      properties:
        token:
          type: string
          minLength: 20
          maxLength: 128
          description: |
            Opaque, 256 bits of `SecureRandom` in base64url. Only its SHA-256 digest is stored, so
            a database dump yields no usable links.
      example:
        token: 8Zr3n0Qw5tYb2Kd7Lm1Vx9Hs4Jc6Pf0Ag8Ne2Ui5Ro

    ResetPasswordRequest:
      type: object
      description: |
        The reset link's token plus the replacement password (UC-A07). Succeeding here terminates
        every session for the account.
      required: [token, new_password]
      properties:
        token:
          type: string
          minLength: 20
          maxLength: 128
          description: The single-use token from the reset mail. Expires one hour after issue.
        new_password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: |
            Same policy as registration — minimum 8 characters, BCrypt strength 12, and a
            72-character ceiling that is BCrypt's own byte limit rather than an arbitrary cap.

    ChangePasswordRequest:
      type: object
      description: |
        Self-service password change for a signed-in caller (UC-A12). The account is taken from the
        session cookie; there is no user id in the body, because a body-supplied id would be a
        caller asserting whose password they are changing.
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
          maxLength: 200
          description: |
            Proof that the person at the keyboard is the account owner and not someone who found an
            unlocked browser. A mismatch is `401 invalid_credentials`.
        new_password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: Must differ from the current password.

    FirebaseAuthRequest:
      type: object
      description: |
        The Firebase ID token from `signInWithPopup(GoogleAuthProvider)` (PLAN §4.0.5). It is the
        whole credential: the server verifies its signature against Google's published keys and
        trusts nothing the client says alongside it — no email, no uid, no "this is a new user"
        flag, because every one of those would be a claim the caller could simply assert.
      required: [id_token]
      properties:
        id_token:
          type: string
          minLength: 20
          maxLength: 4096
          description: |
            A short-lived RS256 JWT issued by Firebase for this project. Never stored and never
            logged — it exists for the length of one verification call.
      example:
        id_token: eyJhbGciOiJSUzI1NiIsImtpZCI6IjE2N...

    LinkProviderRequest:
      type: object
      description: |
        The provider credential to attach to the signed-in account (UC-A09). For `FIREBASE_GOOGLE`
        it is a Firebase ID token, the same value `POST /auth/firebase` takes.

        One field rather than one schema per provider: the server routes on the `{provider}` path
        segment and the adapter for that provider is the only code that interprets the string, which
        is the same seam `IdentityProviderPort` uses for sign-in.
      required: [credential]
      properties:
        credential:
          type: string
          minLength: 20
          maxLength: 4096
          description: Provider-issued token. Never stored, never logged, never echoed back.

    AcceptedResponse:
      type: object
      description: |
        Deliberately constant, exactly like `RegistrationResponse`. Any field that varied with
        whether the address is registered would be the enumeration oracle ADR 009 §6 closes.
      required: [status]
      properties:
        status:
          type: string
          enum: [ACCEPTED]
          description: Always this value. The submitted address learns the real outcome by mail.

    CurrentUser:
      type: object
      description: |
        The authenticated caller. Assembled from current database state on every request, never
        from token claims (ADR 009 §2).
      required: [user_id, email, roles, email_verified, linked_providers]
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        username:
          type: string
          nullable: true
          description: Null for an account created through Google or GitHub before a name is picked.
        roles:
          type: array
          description: '`USER` or `ADMIN` — the complete vocabulary (PLAN §4.0.5).'
          items:
            type: string
            enum: [USER, ADMIN]
        email_verified:
          type: boolean
          description: |
            Live, not cached. UC-A08 blocks the planner until this is true, and the "verify your
            email" banner clears the moment the user confirms rather than at the next token expiry.
        linked_providers:
          type: array
          description: |
            Sign-in methods attached to this account (UC-A11). `[LOCAL]` today; task 10 adds
            `FIREBASE_GOOGLE` and `GITHUB` without changing this shape.
          items:
            type: string
            enum: [LOCAL, FIREBASE_GOOGLE, GITHUB]
      example:
        user_id: 6f9619ff-8b86-d011-b42d-00c04fc964ff
        email: aisyah@example.com
        username: aisyah
        roles: [USER]
        email_verified: true
        linked_providers: [LOCAL]

    AuthSessionResponse:
      type: object
      description: |
        Body of a successful sign-in or refresh. The tokens are **not** here — they are `Set-Cookie`
        headers, because a token in a JSON body is a token JavaScript can read, which is exactly
        what ADR 002 rejected the `Authorization` header for.

        A wrapper rather than the user object itself, which is what let task 10 add PLAN §4.0.5's
        `is_new_user` and `provider_linked` for the Firebase and GitHub paths without reshaping a
        response the local flow already published.
      required: [user, is_new_user, provider_linked]
      properties:
        user:
          $ref: '#/components/schemas/CurrentUser'
        is_new_user:
          type: boolean
          default: false
          description: |
            The account was created by this very request (UC-A02, UC-A03). Drives the onboarding
            copy, and is the condition PLAN §4.0.10 puts the welcome mail behind — so it is `false`
            for `/auth/login` and `/auth/refresh`, which never create anything.
        provider_linked:
          type: boolean
          default: false
          description: |
            An existing account gained a new sign-in method as part of this request (UC-A09). Only
            ever `true` when both the account and the incoming provider address were already
            verified (ADR 009 §4); the refusal case is `409 provider_link_required` instead.

    PageMetadata:
      type: object
      description: |
        Pagination envelope fields (PLAN §6.1). A list response is this object plus its own
        `items` array:

        ```yaml
        TripPage:
          allOf:
            - $ref: '#/components/schemas/PageMetadata'
            - type: object
              required: [items]
              properties:
                items:
                  type: array
                  items: { $ref: '#/components/schemas/Trip' }
        ```

        `items` is deliberately not modelled here: OpenAPI 3.0 has no generics, and a
        `items: object` placeholder would erase the element type in the generated client —
        the exact drift codegen exists to prevent.
      required: [page, page_size, total]
      properties:
        page:
          type: integer
          format: int32
          minimum: 0
          description: Zero-based index of the returned page.
        page_size:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          description: Requested page size, echoed so the client need not track it.
        total:
          type: integer
          format: int64
          minimum: 0
          description: Total matching items across all pages.
      example:
        page: 0
        page_size: 20
        total: 142

    AdminUserSummary:
      type: object
      description: |
        One row of the admin user list (UC-A15). Account state only — there is no field here, and
        no endpoint anywhere under `/admin`, that reaches a user's trips, chats, or bookings.
      required:
        - user_id
        - email
        - roles
        - email_verified
        - enabled
        - closed
        - created_at
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          description: |
            Not `format: email`. A closed account's address is the unroutable
            `deleted-<id>@deleted.invalid` placeholder UC-A14 leaves behind, and a strict validator
            would reject the row this list has to be able to show.
          example: aisyah@example.com
        username:
          type: string
          nullable: true
          description: Null for a provider-created account, and for every closed one.
        roles:
          type: array
          items:
            type: string
            enum: [USER, ADMIN]
        email_verified:
          type: boolean
        enabled:
          type: boolean
          description: |
            False when an administrator switched the account off, and also false for every closed
            account — `closed` is what tells the two apart.
        closed:
          type: boolean
          description: |
            The owner deleted the account (UC-A14). The row survives so trips keep an owner, but it
            is anonymised, holds no credential, and refuses every admin mutation.
        created_at:
          type: string
          format: date-time

    AdminUserDetail:
      description: |
        One account in full (UC-A15). The summary plus the sign-in methods attached to it, which is
        what tells an administrator whether "reset password" is even applicable — a provider-only
        account has no local password to replace (ADR 009 §4).
      allOf:
        - $ref: '#/components/schemas/AdminUserSummary'
        - type: object
          required: [linked_providers, has_local_password, updated_at]
          properties:
            linked_providers:
              type: array
              items:
                type: string
                enum: [LOCAL, FIREBASE_GOOGLE, GITHUB]
            has_local_password:
              type: boolean
              description: |
                `password_hash IS NOT NULL`. The password itself is never exposed in any form —
                this is the single bit an administrator needs, and it is the same bit ADR 009 §4
                keys the OAuth-only rules off.
            updated_at:
              type: string
              format: date-time

    AdminUserPage:
      description: One page of `AdminUserSummary` plus the shared pagination envelope (PLAN §6.1).
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminUserSummary'

    UpdateAdminUserRequest:
      type: object
      description: |
        The one account field an administrator may change (PLAN §4.0.6). Role is deliberately absent:
        `docs/AGENT-HARNESS.md` §1 puts role hierarchies out of scope, and an endpoint that can grant
        `ADMIN` is a privilege-escalation surface that no use case asks for.
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: |
            `false` switches the account off **and terminates every session it holds** (ADR 009 §1).
            `true` restores access; it does not resurrect the terminated sessions, and the owner
            signs in again.

    AdminResetPasswordRequest:
      type: object
      description: |
        The replacement password an administrator sets on someone else's account (UC-A16). It is
        never returned, never logged, and never mailed — the administrator communicates it out of
        band, which is what makes the out-of-band channel the second factor.
      required: [new_password]
      properties:
        new_password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: |
            Same policy as registration — minimum 8 characters, BCrypt strength 12, and a
            72-character ceiling that is BCrypt's own byte limit rather than an arbitrary cap.

    GeoCoordinates:
      type: object
      description: |
        A map position. One object rather than two sibling fields, because the domain refuses a
        half-set coordinate: "latitude known, longitude null" silently places a city on the
        Greenwich meridian and looks like data rather than like the mistake it is. Nesting the pair
        means a client reads it as present or absent and never has to decide what a lone latitude
        means.
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
      example:
        latitude: 35.6762
        longitude: 139.6503

    SupportedDestination:
      type: object
      description: |
        One fully covered destination (ADR 010 §4).

        There is no id. `slug` is the public handle — it is what the curated seeds, the URLs, and
        `DestinationNotCoveredDetails.supported` are all keyed on, and publishing the surrogate key
        beside it would give clients two ways to name one place and guarantee that half of them
        pick the one this API does not accept back.
      required: [slug, name, country_code, timezone]
      properties:
        slug:
          type: string
          maxLength: 120
          description: Stable handle, also the partition key for the per-destination indexes.
          example: tokyo-jp
        name:
          type: string
          description: Display name in English. `ms` strings are translated at presentation.
          example: Tokyo
        country_code:
          type: string
          minLength: 2
          maxLength: 2
          description: |
            ISO 3166-1 alpha-2. App packs are per country rather than per city (ADR 010 §1), so a
            client that shows "apps to install" resolves them from this rather than from the slug.
          example: JP
        timezone:
          type: string
          description: |
            IANA zone. A property of the place, not of a trip — the picker needs it to show local
            time before any itinerary exists.
          example: Asia/Tokyo
        coordinates:
          allOf:
            - $ref: '#/components/schemas/GeoCoordinates'
          nullable: true
          description: Absent when the destination was curated without a position.

    SupportedDestinations:
      type: object
      description: |
        The body of `GET /destinations/supported`.

        An object rather than a bare array: a top-level array cannot gain a field, and this
        response will want one — the `sample_data: true` flag ADR 010 §3 requires in development,
        or a coverage timestamp. Wrapping now costs one key; wrapping later breaks every generated
        client.
      required: [destinations]
      properties:
        destinations:
          type: array
          description: |
            Every `FULL` destination, in a stable order. An empty array is a truthful answer and
            means nothing has been curated yet — the picker says so rather than inventing options.
          items:
            $ref: '#/components/schemas/SupportedDestination'
      example:
        destinations:
          - slug: tokyo-jp
            name: Tokyo
            country_code: JP
            timezone: Asia/Tokyo
            coordinates:
              latitude: 35.6762
              longitude: 139.6503
          - slug: bangkok-th
            name: Bangkok
            country_code: TH
            timezone: Asia/Bangkok
            coordinates:
              latitude: 13.7563
              longitude: 100.5018

    TripStatus:
      type: string
      description: |
        Wizard progress for a trip — the exact vocabulary of the "Trip status" table in
        `USE-CASES.md`, in the order that table lists it (PLAN §3.1).

        **Read-only on the wire.** No request body anywhere on this API accepts a status. It is
        derived from brief completeness, and moved to `ARCHIVED` by the archive action; a client
        able to set it could declare `BRIEF_COMPLETE` over an empty brief and step past the gate in
        front of C2.

        C1 owns `DRAFT`, `CLARIFICATION_NEEDED`, and `BRIEF_COMPLETE`. The rest are published here
        because a client has to be able to render a trip in any of them, not because C1 can set
        them.
      enum:
        - DRAFT
        - BRIEF_COMPLETE
        - CLARIFICATION_NEEDED
        - RESEARCH_QUEUED
        - RESEARCH_RUNNING
        - RESEARCH_READY
        - DESTINATION_SELECTED
        - ITINERARY_READY
        - BOOKING_IN_PROGRESS
        - BOOKED
        - ARCHIVED
      example: DRAFT

    Trip:
      type: object
      description: |
        One trip, as every trip endpoint returns it.

        No `user_id`: ownership comes from the session on every request, and echoing the owner back
        would publish an identifier that no endpoint on this API accepts as input.
      required: [trip_id, name, status, version, created_at, updated_at]
      properties:
        trip_id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
          example: Japan in spring
        status:
          $ref: '#/components/schemas/TripStatus'
        selected_recommendation_id:
          type: string
          format: uuid
          nullable: true
          description: The chosen recommendation. Absent until C2 completes (UC-C2-06).
        version:
          type: integer
          format: int32
          minimum: 0
          description: |
            The optimistic lock (ADR 008 §1). Published on every read because a client that cannot
            see the version cannot send `expected_version`, and would have no option but to force
            overwrite.
          example: 3
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TripList:
      type: object
      description: |
        The body of `GET /trips`.

        An object rather than a bare array: a top-level array cannot gain a field, and this one
        will want page metadata when a single user's trip list stops being a screenful. Wrapping
        now costs one key; wrapping later breaks every generated client.
      required: [trips]
      properties:
        trips:
          type: array
          description: Newest first. Empty for a new account, which is an answer rather than an error.
          items:
            $ref: '#/components/schemas/Trip'

    CreateTripRequest:
      type: object
      description: |
        The name is the only field. Everything else about a new trip is the server's: the owner
        from the session, `DRAFT` as the status, and an empty brief written in the same
        transaction.
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          example: Japan in spring

    RenameTripRequest:
      allOf:
        - $ref: '#/components/schemas/ExpectedVersion'
        - type: object
          description: |
            No `status`. See the `TripStatus` note on why the field is not writable anywhere.
          required: [name]
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 120
              example: Kyoto and Osaka

    ArchiveTripRequest:
      allOf:
        - $ref: '#/components/schemas/ExpectedVersion'
        - type: object
          description: |
            A body with one field rather than an empty `POST`: archiving is a mutation of a
            versioned aggregate like any other, and making a trip read-only while the agent is
            mid-edit loses that edit.

    ResearchJobStatus:
      type: string
      description: |
        The lifecycle of one research run (UC-C2-02). Lower-case on the wire; the backend stores
        the UPPER_SNAKE form and maps it here.

        - `queued` — persisted, waiting for a worker
        - `running` — the agent is executing
        - `completed` — a result exists; the trip is `RESEARCH_READY`
        - `failed` — the run ended without a result; `error_code` says why, and the trip is back at
          `BRIEF_COMPLETE` so it can be re-run
      enum:
        - queued
        - running
        - completed
        - failed
      example: queued

    ResearchJob:
      type: object
      description: |
        One research run, as `startResearch` (202) and `getResearchJob` (200) both return it
        (UC-C2-01/02).

        The start response carries `job_id` and `status: queued`; the poll adds `progress_pct` while
        running and `error_code` on failure. `started_at` and `completed_at` are absent until the run
        reaches them. There is no trip-level failed status — a failed job leaves the trip
        recoverable.
      required: [job_id, trip_id, status, progress_pct, attempts]
      properties:
        job_id:
          type: string
          format: uuid
        trip_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ResearchJobStatus'
        progress_pct:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: Coarse progress for the poll UI. Advisory; never orders anything.
          example: 0
        error_code:
          type: string
          nullable: true
          description: |
            A registered-style `snake_case` reason present only when `status` is `failed`, e.g.
            `research_timeout`. Distinct from the API error catalog: it describes why a run ended,
            not an HTTP response.
          example: research_timeout
        attempts:
          type: integer
          format: int32
          minimum: 0
          description: How many times this job entered `running`. A re-run is a new job, not a bump.
          example: 1
        started_at:
          type: string
          format: date-time
          nullable: true
          description: When the run entered `running`; absent while `queued`.
        completed_at:
          type: string
          format: date-time
          nullable: true
          description: When the run reached a terminal state; absent while active.

    SelectRecommendationRequest:
      type: object
      description: Body of `POST .../selected-recommendation` (UC-C2-06).
      required: [recommendation_id]
      properties:
        recommendation_id:
          type: string
          format: uuid

    RankedRecommendations:
      type: object
      description: |
        Latest C2 research outcome for a trip (UC-C2-03/04/05/10). When
        `no_confident_result` is true, `recommendations` is empty.
      required:
        - trip_id
        - research_run_id
        - no_confident_result
        - algorithm_version
        - recommendations
      properties:
        trip_id:
          type: string
          format: uuid
        research_run_id:
          type: string
          format: uuid
        no_confident_result:
          type: boolean
        algorithm_version:
          type: string
        selected_recommendation_id:
          type: string
          format: uuid
          nullable: true
        recommendations:
          type: array
          items:
            $ref: '#/components/schemas/RankedRecommendation'

    RankedRecommendation:
      type: object
      description: One scored destination proposal from a research run.
      required:
        - recommendation_id
        - destination_id
        - destination_slug
        - country_code
        - rank
        - fit_score
        - score_breakdown
        - rationale
        - traveler_guide
        - risks
        - source_refs
        - algorithm_version
      properties:
        recommendation_id:
          type: string
          format: uuid
        destination_id:
          type: string
          format: uuid
        destination_slug:
          type: string
        country_code:
          type: string
          minLength: 2
          maxLength: 2
        rank:
          type: integer
          minimum: 1
        fit_score:
          type: number
          format: double
        score_breakdown:
          $ref: '#/components/schemas/ScoreBreakdown'
        est_cost:
          allOf:
            - $ref: '#/components/schemas/Money'
          nullable: true
        rationale:
          type: string
        traveler_guide:
          $ref: '#/components/schemas/TravelerGuide'
        risks:
          type: array
          items:
            type: string
        best_window:
          type: string
          nullable: true
        source_refs:
          type: array
          items:
            $ref: '#/components/schemas/RecommendationSourceRef'
        algorithm_version:
          type: string

    ScoreBreakdown:
      type: object
      description: DSA score terms (never LLM-authored).
      required:
        - interest_match
        - seasonality_fit
        - price_fit
        - area_coverage
        - freshness_factor
        - confidence
        - fit_score
      properties:
        interest_match: { type: number, format: double }
        seasonality_fit: { type: number, format: double }
        price_fit: { type: number, format: double }
        area_coverage: { type: number, format: double }
        freshness_factor: { type: number, format: double }
        confidence: { type: number, format: double }
        fit_score: { type: number, format: double }

    TravelerGuide:
      type: object
      description: Per-recommendation traveler guide sections (PLAN §4.1).
      required: [overview, areas, highlights, local_app_pack, source_refs]
      properties:
        overview:
          type: string
        why_now:
          type: string
          nullable: true
        areas:
          type: array
          items:
            type: string
        food:
          type: string
          nullable: true
        highlights:
          type: array
          items:
            type: string
        mobility:
          type: string
          nullable: true
        practical:
          type: string
          nullable: true
        local_app_pack:
          type: array
          items:
            $ref: '#/components/schemas/LocalAppPackEntry'
        source_refs:
          type: array
          items:
            $ref: '#/components/schemas/RecommendationSourceRef'

    LocalAppPackEntry:
      type: object
      required: [usage, name]
      properties:
        usage:
          type: string
        name:
          type: string
        slug:
          type: string
          nullable: true

    RecommendationSourceRef:
      type: object
      required: [source_ref, field_group]
      properties:
        source_ref:
          type: string
        source_url:
          type: string
          nullable: true
        field_group:
          type: string

    DestinationGuideDetail:
      type: object
      description: Knowledge-backed destination guide for drawers / chat context.
      required:
        - destination_id
        - slug
        - name
        - country_code
        - locale
        - areas
        - top_pois
        - transport_modes
        - local_app_pack
        - source_refs
      properties:
        destination_id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        country_code:
          type: string
        locale:
          type: string
        overview:
          type: string
          nullable: true
        food:
          type: string
          nullable: true
        practical:
          type: string
          nullable: true
        areas:
          type: array
          items:
            $ref: '#/components/schemas/DestinationAreaSummary'
        top_pois:
          type: array
          items:
            $ref: '#/components/schemas/DestinationPoiSummary'
        transport_modes:
          type: array
          items:
            $ref: '#/components/schemas/DestinationTransportMode'
        local_app_pack:
          type: array
          items:
            $ref: '#/components/schemas/DestinationTravelApp'
        source_refs:
          type: array
          items:
            $ref: '#/components/schemas/RecommendationSourceRef'

    DestinationAreaSummary:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }

    DestinationPoiSummary:
      type: object
      required: [poi_id, slug, name, category]
      properties:
        poi_id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        category: { type: string }
        description: { type: string, nullable: true }

    DestinationTransportMode:
      type: object
      required: [mode, display_name]
      properties:
        mode: { type: string }
        display_name: { type: string }
        description: { type: string, nullable: true }

    DestinationTravelApp:
      type: object
      required: [slug, name, category]
      properties:
        slug: { type: string }
        name: { type: string }
        category: { type: string }
        description: { type: string, nullable: true }

    Money:
      type: object
      description: |
        An amount and its currency (PLAN §4.0.2-A).

        **`amount` is a decimal string, not a JSON number.** Money is `BigDecimal` in Java and
        `numeric` in Postgres for the whole of its life precisely because binary floating point
        cannot represent `4000.10`; serialising it as a JSON number hands it to a JavaScript client
        as a `double` and undoes that at the last hop. A string survives the round trip exactly.

        The server rejects a negative amount, an unknown currency code, and more decimal places
        than the currency has minor units — 2 for `USD`, 0 for `JPY`.
      required: [amount, currency]
      properties:
        amount:
          type: string
          pattern: '^\d+(\.\d+)?$'
          description: Non-negative decimal, in the currency's own precision.
          example: '4000.00'
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO 4217.
          example: MYR

    DateRange:
      type: object
      description: |
        An inclusive span of calendar days. `start_date == end_date` is a one-day trip.

        Calendar dates, never instants: "arrive on 3 April" is a fact about the destination, and
        turning it into a point on the UTC timeline needs a timezone the traveller has not chosen
        yet — one that would shift the date across a boundary for anybody east of Greenwich.

        One object rather than two sibling fields on the brief, so a client reads dates as present
        or absent and never has to decide what a start with no end means.
      required: [start_date, end_date]
      properties:
        start_date:
          type: string
          format: date
          example: '2026-04-03'
        end_date:
          type: string
          format: date
          example: '2026-04-12'

    PartySize:
      type: object
      description: |
        How many people are travelling.

        Two counts rather than one total, because the split changes the answer rather than only the
        arithmetic: room occupancy, entry pricing, and the `area_coverage` term of the C2 fit score
        all treat a family of four differently from four adults. At least one adult, and at most 20
        travellers — above that no C4 supplier quotes as a single party, so a brief that exceeded it
        would produce an itinerary that cannot be booked.
      required: [adults, children]
      properties:
        adults:
          type: integer
          format: int32
          minimum: 1
          maximum: 20
          example: 2
        children:
          type: integer
          format: int32
          minimum: 0
          maximum: 19
          example: 0

    DateFlexibility:
      type: string
      description: |
        How far the dates may move (UC-C1-04).

        Kept separate from `dates` rather than modelled as a widened range: a range says which days
        were entered, flexibility says how much C2 may shift them for a cheaper week or a better
        season. Widening the range would lose the original intent and make `seasonality_fit` score
        a window the user never asked for.
      enum: [FIXED, FLEXIBLE_WEEK, FLEXIBLE_MONTH]
      example: FLEXIBLE_WEEK

    TravelPace:
      type: string
      description: |
        How densely the traveller wants their days filled. An ordinal band rather than a number,
        because nobody can answer "how many activities per day" honestly and a number invites a
        precision the itinerary would then be held to.
      enum: [RELAXED, MODERATE, PACKED]
      example: MODERATE

    TravelInterest:
      type: string
      description: |
        What the traveller wants out of the trip — the `interests` half of the C2 fit score
        (PLAN §4.1.2).

        A closed vocabulary, aligned one-to-one with the knowledge base's POI categories. Free text
        would be friendlier to type and useless to rank: "temples and ramen" cannot be intersected
        with anything the corpus stores, so the interest term would silently contribute zero and
        the user would be told their interests were considered when they were not.
      enum:
        - FOOD
        - SIGHTSEEING
        - MUSEUMS
        - NATURE
        - SHOPPING
        - NIGHTLIFE
        - EXPERIENCES
      example: FOOD

    ClarificationType:
      type: string
      description: |
        What kind of value a question is asking for. The frontend picks a control from it, and the
        server picks which field of `ClarificationAnswer` it will read — an answer whose filled
        slot disagrees with this is `400 validation_failed`, never a silently ignored answer.
      enum: [TEXT, NUMBER, MONEY, DATE_RANGE, CHOICE, MULTI_CHOICE]
      example: MONEY

    ClarificationQuestion:
      type: object
      description: |
        One typed question the brief cannot be completed without (UC-C1-04).

        `prompt_key` is a translation key, never a sentence: the frontend resolves it against
        `locales/<lang>/trip_brief.json`, so one payload renders in English and Malay. An English
        string here would be user-facing copy the Malay build could never reach (PLAN §11).
      required: [id, prompt_key, type, options, required]
      properties:
        id:
          type: string
          description: |
            Stable and `snake_case`, and also the name of the brief field the answer sets — it is
            what the answer action routes on. One of `travel_dates`, `date_flexibility`,
            `departure_city`, `budget_max`, `party_size`, `interests`, `pace`.
          example: budget_max
        prompt_key:
          type: string
          description: i18n key under the `trip_brief` namespace.
          example: trip_brief.clarify_budget
        type:
          $ref: '#/components/schemas/ClarificationType'
        options:
          type: array
          description: |
            The permitted values for `CHOICE` and `MULTI_CHOICE`, and empty for every other type.
            Carried in the question rather than fetched separately, so a client renders the control
            from one payload.
          items:
            type: string
          example: []
        required:
          type: boolean
          description: |
            Whether the brief can complete without an answer. Every question C1 generates is
            required, because it only ever asks about a field completeness depends on; the flag is
            here for the LLM-authored questions task 19 adds, which can be optional.
          example: true

    Clarification:
      type: object
      description: |
        The typed gap between this brief and a complete one (UC-C1-04, PLAN §4.1.3).

        **Derived on every read and every write, never stored.** The questions are a pure function
        of the brief's current fields, so the completeness rule and the question list are one
        computation read two ways. A stored question table would be a second copy of that rule, and
        the two would disagree the first time the agent wrote a field through `update_trip_brief`
        without passing through the endpoint that refreshed the table.

        Always present, and empty exactly when the brief is complete — so a client never has to
        tell "no questions" apart from "questions not computed".

        Destination preference is deliberately never asked about: an empty preference is a
        legitimate answer that lets C2 rank the whole covered set, and demanding one would make the
        product unusable for the traveller whose actual question is "where should I go?".
      required: [questions]
      properties:
        questions:
          type: array
          description: In a stable order, so answering one does not reshuffle the form.
          items:
            $ref: '#/components/schemas/ClarificationQuestion'

    ClarificationAnswer:
      type: object
      description: |
        One answer to one outstanding question — the typed diff ADR 008 §3 requires of an action
        body.

        **Exactly one slot must be filled**, and it must be the one the question's `type` names.
        The alternative — a single `value` string parsed according to the type — cannot carry a
        budget (an amount plus a currency) or a date range (two dates) without inventing a text
        encoding, and a text encoding is a parser that fails at runtime in a place this contract
        cannot describe.
      required: [question_id]
      properties:
        question_id:
          type: string
          description: The `ClarificationQuestion.id` being answered.
          example: budget_max
        text:
          type: string
          nullable: true
          description: For `TEXT`.
        number:
          type: integer
          format: int32
          nullable: true
          description: For `NUMBER`.
        money:
          allOf:
            - $ref: '#/components/schemas/Money'
          nullable: true
          description: For `MONEY`.
        date_range:
          allOf:
            - $ref: '#/components/schemas/DateRange'
          nullable: true
          description: For `DATE_RANGE`.
        choice:
          type: string
          nullable: true
          description: For `CHOICE`. One of the question's `options`.
        choices:
          type: array
          nullable: true
          description: |
            For `MULTI_CHOICE`. An empty array counts as unfilled — selecting nothing is not an
            answer, it is the question restated.
          items:
            type: string

    TripBrief:
      type: object
      description: |
        The structured requirement set for one trip — what C1 produces and C2 consumes — together
        with the trip status it implies and the questions it still needs.

        The three travel in one payload because they are only consistent together, and this is the
        body of every brief read **and** of every successful brief mutation (ADR 008 §2: "every
        mutation returns the new full resource with its incremented version"). After a save the
        client holds exactly what the server holds, so the debounced form's next keystroke does not
        race a refetch it would otherwise have to make.

        Every field is nullable or empty, because a brief under construction is incomplete by
        definition and PLAN §4.1.3 answers incompleteness with `clarification` rather than a
        rejected save. What is *present* is always valid.

        There is no brief id: the brief is the trip's one child, addressed only through `tripId`.
      required:
        - trip_id
        - status
        - destinations
        - surprise_me
        - interests
        - clarification
        - version
        - created_at
        - updated_at
      properties:
        trip_id:
          type: string
          format: uuid
        status:
          allOf:
            - $ref: '#/components/schemas/TripStatus'
          description: |
            The **trip's** status, carried here because it changes as a consequence of saving the
            brief. A client that had to fetch it separately would, in the gap, render a "start
            research" button for a brief the agent had just re-opened.
        destinations:
          type: array
          maxItems: 10
          description: |
            Candidate `destination.slug` values, most-preferred first. Empty means "no preference",
            which is a legitimate answer rather than a gap. Every slug is checked against the
            covered set on save (ADR 010 §4).
          items:
            type: string
          example: [kuala-lumpur]
        surprise_me:
          type: boolean
          description: |
            UC-C1-05's open-destination answer. When true, `destinations` is empty and C2 ranks the
            whole covered set rather than treating the traveller as undecided.
          default: false
        dates:
          allOf:
            - $ref: '#/components/schemas/DateRange'
          nullable: true
        date_flexibility:
          allOf:
            - $ref: '#/components/schemas/DateFlexibility'
          nullable: true
        departure_city:
          type: string
          maxLength: 120
          nullable: true
          description: |
            Free text, deliberately not a slug. People depart from places the knowledge base has
            never curated, and requiring coverage on the origin would refuse a valid trip.
          example: Kuala Lumpur
        budget:
          allOf:
            - $ref: '#/components/schemas/Money'
          nullable: true
          description: The ceiling for the whole trip, not a per-day figure.
        party:
          allOf:
            - $ref: '#/components/schemas/PartySize'
          nullable: true
        interests:
          type: array
          maxItems: 16
          description: Duplicates are collapsed; order is not meaningful.
          items:
            $ref: '#/components/schemas/TravelInterest'
        pace:
          allOf:
            - $ref: '#/components/schemas/TravelPace'
          nullable: true
        clarification:
          $ref: '#/components/schemas/Clarification'
        version:
          type: integer
          format: int32
          minimum: 0
          description: |
            The **brief's** optimistic lock, and what `expected_version` means on both brief write
            paths. The trip carries its own; the two advance independently (ADR 008 §1).
          example: 7
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UpdateTripBriefRequest:
      allOf:
        - $ref: '#/components/schemas/ExpectedVersion'
        - type: object
          description: |
            A `PUT` of the whole resource: **an omitted field clears it.** `PATCH` is forbidden
            project-wide (ADR 008 §3), and a `PUT` that read absence as "leave unchanged" would
            give a client no way at all to un-set a field it entered by mistake.
          properties:
            destinations:
              type: array
              maxItems: 10
              items:
                type: string
            surprise_me:
              type: boolean
              description: |
                UC-C1-05's open-destination answer. When true, the server stores
                `destinations = []` even if the body also names destinations.
            dates:
              allOf:
                - $ref: '#/components/schemas/DateRange'
              nullable: true
            date_flexibility:
              allOf:
                - $ref: '#/components/schemas/DateFlexibility'
              nullable: true
            departure_city:
              type: string
              maxLength: 120
              nullable: true
            budget:
              allOf:
                - $ref: '#/components/schemas/Money'
              nullable: true
            party:
              allOf:
                - $ref: '#/components/schemas/PartySize'
              nullable: true
            interests:
              type: array
              maxItems: 16
              items:
                $ref: '#/components/schemas/TravelInterest'
            pace:
              allOf:
                - $ref: '#/components/schemas/TravelPace'
              nullable: true

    AnswerClarificationRequest:
      allOf:
        - $ref: '#/components/schemas/ExpectedVersion'
        - type: object
          description: |
            At least one answer. An action that answers nothing would consume a version and change
            no state, leaving the client unable to tell which of the two happened.
          required: [answers]
          properties:
            answers:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/ClarificationAnswer'

    ExpectedVersion:
      type: object
      description: |
        Optimistic-concurrency fragment (ADR 008 §2). Every mutation of a versioned aggregate
        composes this into its request body:

        ```yaml
        UpdateTripBriefRequest:
          allOf:
            - $ref: '#/components/schemas/ExpectedVersion'
            - type: object
              properties: { destinations: { ... } }
        ```

        The version travels in the body rather than in `ETag`/`If-Match` precisely because a
        body field is expressible in OpenAPI and flows through codegen into the typed client;
        header-based concurrency would need hand-plumbed handling in the generated-client
        layer this project forbids editing.

        Omitting `expected_version` is `400 validation_failed` — **never** a force-overwrite.
        A mismatch is `409 version_conflict` carrying `details.current_version`.
      required: [expected_version]
      properties:
        expected_version:
          type: integer
          format: int32
          minimum: 0
          description: The version the client based its edit on.
          example: 7

    ChatMessageRole:
      type: string
      description: |
        What a stored turn element is.

        **Lower-case snake, deliberately** (STATUS F-31). The Java enum and the `ck_message_role`
        CHECK constraint spell these `USER`, `TOOL_CALL`, and so on — those are the persisted
        values and cannot change. ADR 007's wire vocabulary is lower-case, so the conversion
        happens once, in the chat DTO layer (`api/dto/chat/ChatWireNames`), and a client never has
        to normalise case. Chat is the only surface with this rule: `roles` and `linked_providers`
        elsewhere in this contract stay upper-case.

        There is no `reasoning` member and there must never be one — tasks/20 forbids storing or
        returning hidden chain-of-thought, and the absence of a role to persist it under is what
        makes that structural rather than procedural.
      enum: [user, assistant, system, tool_call, tool_result, lifecycle_event]

    ChatMessageStatus:
      type: string
      description: |
        How a stored message ended, or that it has not ended yet. Lower-case snake for the reason
        `ChatMessageRole` gives.

        `interrupted` is ADR 007's persisted partial turn: a client that disconnects mid-answer
        leaves the text that arrived, labelled. `failed` is the same shape after a provider error.
        A reader that only needs "whole answer or not" treats everything except `complete` as
        partial; the distinction is kept on the wire because only the server can know it.
      enum: [streaming, complete, interrupted, failed]

    ChatMessage:
      type: object
      description: |
        One stored message.

        No `conversation_id` — the page carries it once.
      required: [message_id, seq, role, content, status, created_at]
      properties:
        message_id:
          type: string
          format: uuid
        seq:
          type: integer
          format: int64
          minimum: 1
          description: |
            **The ordering.** Per-conversation and monotonic, allocated under a row lock
            (migration V19). This is the only total order on the wire: `created_at` cannot be one
            (see below), so a client merging two pages into one keyed collection has to sort by
            this. It is also ADR 007's resume position — the same number a stream sends as
            `Last-Event-ID` — so it is already published on the SSE side.

            Compare it, and pass it back as a cursor. Do not do arithmetic on it: it is allowed to
            contain gaps, so a difference of five does not mean five messages.
        role:
          $ref: '#/components/schemas/ChatMessageRole'
        content:
          type: string
          description: |
            User-visible text only. Never a provider reasoning trace and never a raw provider
            event — there is no column it could be stored in (migration V19) and no frame it could
            arrive on (ADR 007).
        status:
          $ref: '#/components/schemas/ChatMessageStatus'
        client_message_id:
          type: string
          maxLength: 64
          nullable: true
          description: |
            The retry key the client minted before sending. Present only on a `user` message —
            only a client-authored message can be re-sent — and null on everything the server
            wrote.
        created_at:
          type: string
          format: date-time
          description: |
            When the row was written. **Not an ordering, and not usable as one.** `now()` is fixed
            for a whole transaction in Postgres, so every row one turn writes — the tool call, the
            tool result, the assistant reply — shares this value byte for byte. Sorting by it is
            not "close enough": those rows are unordered under it. Use `seq`.

    ChatHistoryPage:
      description: |
        One page of conversation history — the shared `page`/`page_size`/`total` envelope plus this
        endpoint's own typed items and the conversation they belong to.
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [items]
          properties:
            conversation_id:
              type: string
              format: uuid
              nullable: true
              description: |
                Null when the caller has no conversation on this surface yet — a new account
                opening the planner home. That is an empty page rather than a `404`, because "you
                have not started chatting" is an answer, and a 404 would put the client into an
                error state on the happy path of a first visit.
            items:
              type: array
              description: Oldest first within the page, ordered by the server's `seq`.
              items:
                $ref: '#/components/schemas/ChatMessage'

    SendChatMessageRequest:
      type: object
      description: |
        The body of both chat `POST`s.

        `conversation_id` is optional in both directions: the first planner turn is the request
        that *creates* a conversation, and a trip's thread is addressed by its path. Supplied, it
        must be the caller's and must belong to the addressed surface, or the answer is `404`.
      required: [client_message_id, content]
      properties:
        client_message_id:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            **The idempotency key, and it is required.** The client mints it before sending and
            reuses it verbatim on every retry; `uq_message_conversation_client_id` refuses a second
            insert under it, and it comes back on the `message_start` echo so the optimistic bubble
            already on screen is updated rather than duplicated.

            Not server-generated with a fallback: a server-generated key would differ on the retry
            and would therefore guarantee the duplicate it exists to prevent.
          example: 019279e2-6f2c-7c3a-9a1f-2c9a4f0e1b77
        content:
          type: string
          minLength: 1
          maxLength: 8000
          description: The user's message. Markdown is sanitised server-side on persist (ADR 007).
          example: A week in Japan in spring, mid budget.
        conversation_id:
          type: string
          format: uuid
          nullable: true

  responses:
    ChatEventStream:
      description: |
        The assistant turn, as Server-Sent Events.

        **The event union is deliberately not modelled here** (ADR 007). No OpenAPI generator emits
        a usable `text/event-stream` client, so the most safety-critical type in the application
        cannot come from `npm run codegen`. It is hand-authored in
        `apps/frontend/src/lib/api/chat-events.ts` and mirrored by the backend's sealed
        `application/chat/ChatStreamEvent`, so that adding a member is a compile error on at least
        one side. This body is therefore documented in prose; the schema below says only that the
        response is a byte stream.

        Frames, in the order they arrive:

        | `event:` | Meaning |
        |---|---|
        | `message_start` | A message opened. The first is the server's echo of your own message and carries `client_message_id` — that field is how an optimistic bubble is reconciled instead of duplicated. The second opens the assistant turn. |
        | `text_delta` | A chunk of the answer. Rendered as plain text while streaming (ADR 007). |
        | `tool_use_start`, `tool_input_delta`, `tool_use_end`, `tool_result` | Tool lifecycle. Emitted by the planner `create_trip` handoff (task 21) and the trip intake tools `update_trip_brief` / `answer_clarification` (task 22). |
        | `trip_created` | The handoff (PLAN §3.2). Emitted after the `create_trip` tool commits, never parsed from prose. |
        | `brief_updated` | A trip's brief was written by an intake tool (task 22, UC-C5-09). Carries `trip_id`. Emitted only after `update_trip_brief` or `answer_clarification` commits, never parsed from prose; the client re-fetches the brief and trip detail. |
        | `research_started` | Research was started from chat (task 27, UC-C5-03). Carries `trip_id` and `job_id`. Emitted only after `start_research` commits; the client invalidates trip detail and polls the job. |
        | `destination_selected` | A destination was selected from chat (task 27, UC-C5-05). Carries `trip_id`. Emitted only after `select_recommendation` commits; the client invalidates trip detail and recommendations. |
        | `usage` | Token accounting. Nothing in the UI renders it. |
        | `message_end` | How the message finished: `complete`, `interrupted`, or `failed`. |
        | `done` | The turn finished normally. The server closes after this. |
        | `error` | A terminal failure carrying the §6.1 envelope, then close. **Never a bare stream abort.** `code` is always a registered `ErrorCode`; the provider's own text is logged, never streamed. |

        A `: ping` comment arrives every 15 seconds so a proxy does not reap a connection that is
        waiting on a model rather than idle.

        **`id:`** carries the `seq` of the message a frame opens or closes, and appears on nothing
        else. An id on every frame would promise a resume position that nothing can replay — token
        deltas are not persisted individually — and repeating one message's `seq` across its own
        deltas would make a client's duplicate filter discard every token after the first.

        **Resume.** Send `Last-Event-ID` on a reconnect, with the same `client_message_id`. If the
        turn it names already finished, the server replays the persisted messages after that id and
        closes with `done` carrying `stop_reason: replay` — no model call, and the same answer you
        were reading. If the turn was cut mid-sentence it is regenerated instead, which the
        idempotency key makes safe; the deltas you already hold were never persisted, so there is
        nothing to resume from. An unparseable header is treated as absent, never as an error.

        **Disconnecting is safe and is not a loss.** The server cancels the model call and marks the
        partial assistant message `interrupted`; whatever text arrived is kept and reloads labelled
        as cut short.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        X-Conversation-Id:
          $ref: '#/components/headers/XConversationId'
        X-Accel-Buffering:
          $ref: '#/components/headers/XAccelBuffering'
      content:
        text/event-stream:
          schema:
            type: string
            description: |
              An SSE byte stream. Typed only as a string on purpose — see the description above.

    ChatHistory:
      description: One page of conversation history, newest page first, `seq` ascending within it.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ChatHistoryPage'
    ValidationFailed:
      description: |
        The request failed schema or constraint validation. `details.fields` maps field name to
        an English message (`ValidationFailedDetails`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            code: validation_failed
            message: The request is not valid.
            details:
              fields:
                expected_version: must not be null

    Unauthorized:
      description: No valid session. The caller must sign in.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            code: unauthorized
            message: Authentication is required.
            details: {}

    Forbidden:
      description: Authenticated, but not permitted to act on this resource.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            code: forbidden
            message: This action is not allowed.
            details: {}

    NotFound:
      description: |
        No resource at this path, or none owned by the caller. Ownership failures return 404
        rather than 403 so the API does not confirm that another user's resource exists.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            code: not_found
            message: The requested resource does not exist.
            details: {}

    UserNotFound:
      description: |
        No account with this id (PLAN §4.0.6). Deliberately distinct from `not_found`: only an
        administrator can reach it, and an administrator may already list every account, so naming
        the condition discloses nothing and makes a mistyped id diagnosable.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            code: user_not_found
            message: No account exists with that identifier.
            details: {}

    AccountClosed:
      description: |
        The target account was closed by its owner (UC-A14). Its row survives so trips keep an
        owner, but it is anonymised and holds no credential — there is nothing left to disable and
        nothing that may be given a password.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            code: account_closed
            message: This account has been closed.
            details: {}

    TripMutated:
      description: |
        The **new full resource** with its incremented `version` (ADR 008 §2). Returning the whole
        trip rather than an acknowledgement is what makes the conflict rules usable: the client
        holds exactly what the server holds, including the version its next write must echo.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Trip'

    TripBriefState:
      description: |
        The brief, the trip status it implies, and the outstanding questions — one consistent
        payload, and the **new full resource** after any mutation (ADR 008 §2). `version` is the
        brief's, and is what `expected_version` means on both brief write paths.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TripBrief'

    ResearchJobAccepted:
      description: |
        The research run was accepted and queued (UC-C2-01). `status` is `queued` and the trip has
        moved to `RESEARCH_QUEUED`; the run executes on a background worker and the client polls
        `getResearchJob`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResearchJob'

    ResearchJobState:
      description: The current state of a research job (UC-C2-02).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResearchJob'

    ResearchNotReady:
      description: |
        Ranked recommendations are not available yet (UC-C2-03). The trip is not
        `RESEARCH_READY` (or `DESTINATION_SELECTED` with a selection). Poll the research job.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            code: research_not_ready
            message: Research results are not ready for this trip yet.
            details: {}

    TripBriefNotFound:
      description: |
        Nothing to write, for one of two reasons that share `404`.

        - `not_found` — no trip with this id, **or** one that is not the caller's. Deliberately
          identical, so the endpoint cannot confirm that another user's trip exists.
        - `destination_not_covered` — a named destination has no curated knowledge (ADR 010 §4).
          `details.requested` echoes the slug so a typo is visible and `details.supported` lists the
          ones that are covered, because the honest answer to "can you plan Osaka?" is "no, but
          here is what we do know". It is never accepted and then ranked near zero, which would
          read as "we considered it and it is a poor match" when nobody ever looked.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            code: destination_not_covered
            message: No curated travel knowledge exists for 'osaka' yet.
            details:
              requested: osaka
              supported: [kuala-lumpur, penang, singapore]

    VersionConflict:
      description: |
        The `expected_version` in the request body does not match the stored version
        (ADR 008). `details.current_version` carries the server's version so the client can
        re-read, re-apply its edit, and retry. There is no implicit winner.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            code: version_conflict
            message: The resource was modified by someone else.
            details:
              current_version: 9

    AuthSession:
      description: |
        Signed in. Two `Set-Cookie` headers carry the session; the body describes the user.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Set-Cookie:
          $ref: '#/components/headers/SetSessionCookies'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthSessionResponse'

    InvalidCredentials:
      description: |
        Sign-in failed. **One response for every cause** — unknown email, unknown username, wrong
        password, and an OAuth-only account with no local password are indistinguishable, so this
        endpoint cannot be used to discover which addresses are registered (ADR 009 §6).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            code: invalid_credentials
            message: The email, username, or password is incorrect.
            details: {}

    SignInForbidden:
      description: |
        The credential was correct, but the account may not sign in yet.

        - `email_not_verified` — UC-A08. The frontend offers to resend the verification mail from
          this state, which is why it is a distinct code rather than folded into
          `invalid_credentials`.
        - `account_disabled` — an administrator switched the account off (PLAN §4.0.6).

        Both are raised only *after* the password has verified, so neither reveals anything to a
        caller who does not already hold the credential.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            code: email_not_verified
            message: This email address has not been verified yet.
            details: {}

    AccountLocked:
      description: |
        Five failed attempts within fifteen minutes for this identifier from this address
        (ADR 009 §6). `details.retry_after_seconds` lets the UI show a countdown instead of
        inviting a sixth attempt that cannot succeed.

        Keyed on the *pair*, not on the identifier alone: an identifier-only lock would let anyone
        who knows a username lock its owner out of their own account.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            code: account_locked
            message: Too many failed sign-in attempts. Try again later.
            details:
              retry_after_seconds: 900

    InvalidToken:
      description: |
        The request cannot be completed, for one of two reasons that share this status.

        - `invalid_token` — the verification or password-reset token is unknown, expired, or already
          spent. **One code for all three**, for the same reason `invalid_credentials` covers four
          causes: telling "expired" apart from "never existed" confirms that a token was once
          issued, which is a fact about somebody else's mailbox. The UI's correct reaction is
          identical in every case — offer to send a fresh link.
        - `validation_failed` — on `/auth/password/reset` only, the *new password* failed the
          policy. `details.fields` names it. The token is **not** spent in this case, so the user
          can correct the password and reuse the same link.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            code: invalid_token
            message: This link is no longer valid.
            details: {}

    RateLimited:
      description: |
        The per-email or per-address window for this mail action is exhausted (ADR 009 §6).
        `details.retry_after_seconds` lets the UI show a countdown.

        Keyed on the submitted address and the client IP, never on account existence, so this
        response is reachable for an unregistered email exactly as it is for a registered one.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            code: rate_limited
            message: Too many requests. Try again later.
            details:
              retry_after_seconds: 3600

    InvalidProviderToken:
      description: |
        `invalid_firebase_token` — the ID token did not verify. **One response for every cause**:
        a bad signature, an expired token, a token minted for another Firebase project (`aud`), and
        a token whose `firebase.sign_in_provider` is not `google.com` are indistinguishable here.

        The last of those is the ADR 009 §4 assertion, and folding it in with the rest is
        deliberate: a distinct code would tell a caller probing the endpoint exactly which console
        setting to attack next.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            code: invalid_firebase_token
            message: This sign-in could not be verified.
            details: {}

    ProviderSignInForbidden:
      description: |
        The provider verified the caller, but the account may not sign in.

        - `firebase_email_not_verified` — Google reports the address as unconfirmed (PLAN §4.0.5).
          An unconfirmed address cannot create an account and cannot be matched against one.
        - `account_disabled` — an administrator switched the account off (PLAN §4.0.6).
        - `email_not_verified` — the matched account itself is unconfirmed.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            code: firebase_email_not_verified
            message: This provider account has no verified email address.
            details: {}

    ProviderLinkConflict:
      description: |
        The identity cannot be attached, for one of three reasons that share `409`.

        - `provider_link_required` — an account already holds this address, but auto-linking is not
          permitted because either side is unverified (ADR 009 §4). **Nothing was linked.** The
          caller signs in to that account and confirms explicitly. `details.provider` names which.
        - `identity_already_linked` — the provider identity belongs to another account, or this
          account already has one for the provider (PLAN §4.0.5).
        - `last_sign_in_method` — unlinking would leave the account unable to sign in at all.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            code: provider_link_required
            message: Sign in to your existing account to link this provider.
            details:
              provider: FIREBASE_GOOGLE

    ProviderEmailUnavailable:
      description: |
        `provider_email_unavailable` — the provider supplied no address this system may use, so no
        account can be created from it (ADR 009 §4).

        For GitHub that means: no address is both primary and verified, or the only candidate is an
        `@users.noreply.github.com` alias. Accepting either would put an address on an account that
        nobody has proved they control.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            code: provider_email_unavailable
            message: This provider account has no usable email address.
            details: {}

    ProviderUnavailable:
      description: |
        `provider_unavailable` — the identity provider could not be reached, timed out, or answered
        with a fault. Nothing was created, linked, or revoked, so the caller may simply retry.

        Distinct from `internal_error` on purpose: this is somebody else's outage, and the UI's
        correct reaction is "try again", not "report a bug".
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            code: provider_unavailable
            message: The identity provider is unavailable. Please try again.
            details: {}

    MailRequestAccepted:
      description: |
        The request was accepted. This says nothing about whether an account exists — see the
        operation description.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AcceptedResponse'

    InternalError:
      description: Unhandled server fault. `details` is always empty — diagnostics stay in the logs.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            code: internal_error
            message: An unexpected error occurred.
            details: {}
