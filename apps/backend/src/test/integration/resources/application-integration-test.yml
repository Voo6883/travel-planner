# Profile for the Testcontainers suite (Gradle task `integrationTest`).
#
# Deliberately NOT the `test` profile: that one excludes DataSourceAutoConfiguration so the unit
# suite runs without Docker. This profile is the opposite — it wants a real PostgreSQL, and the
# datasource URL is supplied at runtime by AbstractPostgresIntegrationTest from the container.
#
# Flyway and ddl-auto=validate are inherited from application.yml on purpose. Running the suite
# against the same settings production uses is what makes "migrations apply from an empty database"
# a meaningful claim rather than a test-only code path.

spring:
  jpa:
    # Every statement is visible when a mapping test fails, which is when it matters and never
    # otherwise; the suite is small enough that the noise cost is nil.
    show-sql: false

logging:
  level:
    root: WARN
    com.travelplanner: INFO
    org.flywaydb: INFO

travelplanner:
  mail:
    # The suite runs on the stub mailer — AccountLifecycleApiIntegrationTest reads captured mail out
    # of StubMailerAdapter. `autoVerifyRegistrations` used to be derived from that fact, so every
    # account this suite registered came out already verified and the five tests asserting the
    # verification gate could not pass. They had been failing since task 09 introduced the rule
    # against task 08's assertions, unnoticed because Testcontainers needs Docker.
    #
    # A suite whose job is to prove the verification gate has to be able to exercise it: production
    # code path, delivery intercepted.
    auto-verify-registrations: false
