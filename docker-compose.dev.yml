services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: travel-planner-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-travel_planner}
      POSTGRES_USER: ${POSTGRES_USER:-travel_planner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-travel_planner} -d ${POSTGRES_DB:-travel_planner}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
